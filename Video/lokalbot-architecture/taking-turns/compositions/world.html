  </div>
  <script>
    /* cues:begin */
    // Written by build.py from the voice's timings: never edit between these two marks.
    const CUES = {"length": 55.8, "slot": 55.2, "lines": {"c01": {"start": 0.4, "end": 6.375, "words": [["lokalbot", 0.4], ["runs", 1.2], ["five", 1.52], ["ai", 2.0], ["models", 2.32], ["on", 2.8], ["your", 2.96], ["mac", 3.12], ["so", 4.0], ["how", 4.56], ["does", 4.72], ["one", 5.04], ["laptop", 5.28], ["hold", 5.84], ["them", 6.0], ["all", 6.32]]}, "c02": {"start": 6.625, "end": 13.542, "words": [["it", 6.625], ["doesn't", 6.785], ["have", 7.105], ["to", 7.425], ["the", 8.145], ["models", 8.425], ["are", 8.705], ["files", 8.945], ["on", 9.345], ["your", 9.545], ["disk", 10.025], ["under", 10.465], ["ten", 10.785], ["gigabytes", 11.025], ["and", 12.038], ["they", 12.145], ["take", 12.425], ["turns", 12.625], ["in", 13.025], ["memory", 13.185]]}, "c03": {"start": 13.792, "end": 21.402, "words": [["during", 13.792], ["a", 14.112], ["call", 14.472], ["lokalbot", 14.992], ["only", 15.792], ["records", 16.112], ["transcription", 17.392], ["waits", 18.192], ["until", 18.592], ["you", 18.912], ["hang", 19.112], ["up", 19.312], ["and", 19.992], ["autocomplete", 20.192], ["pauses", 20.992]]}, "c04": {"start": 21.652, "end": 29.586, "words": [["then", 21.652], ["the", 21.972], ["speech", 22.212], ["models", 22.452], ["load", 22.932], ["turn", 23.852], ["the", 24.052], ["sound", 24.212], ["into", 24.612], ["a", 24.932], ["transcript", 25.212], ["with", 25.732], ["speakers", 25.892], ["and", 26.972], ["two", 27.172], ["minutes", 27.332], ["after", 27.732], ["they", 28.052], ["finish", 28.212], ["they", 28.852], ["unload", 29.092]]}, "c05": {"start": 29.836, "end": 36.991, "words": [["the", 29.836], ["language", 29.996], ["model", 30.476], ["comes", 30.916], ["in", 31.116], ["next", 31.556], ["and", 31.916], ["writes", 32.236], ["the", 32.476], ["notes", 32.996], ["it", 33.516], ["stays", 33.676], ["ten", 34.076], ["minutes", 34.316], ["in", 34.956], ["case", 35.116], ["you", 35.356], ["ask", 35.436], ["a", 35.676], ["follow-up", 35.876], ["then", 36.556], ["leaves", 36.796]]}, "c06": {"start": 37.341, "end": 44.489, "words": [["the", 37.341], ["autocomplete", 37.501], ["model", 38.301], ["stays", 38.701], ["loaded", 39.181], ["while", 39.661], ["there's", 39.901], ["room", 40.221], ["because", 40.941], ["it", 41.261], ["answers", 41.421], ["every", 41.901], ["keystroke", 42.301], ["in", 42.941], ["about", 43.101], ["fifty", 43.461], ["milliseconds", 44.221]]}, "c07": {"start": 44.839, "end": 51.358, "words": [["a", 44.839], ["broker", 45.199], ["budgets", 45.479], ["half", 46.039], ["your", 46.359], ["memory", 46.519], ["for", 46.999], ["loaded", 47.359], ["models", 48.039], ["and", 48.626], ["what", 48.759], ["you're", 48.892], ["waiting", 49.159], ["for", 49.399], ["goes", 49.759], ["ahead", 50.039], ["of", 50.359], ["background", 50.519], ["work", 51.479]]}, "c08": {"start": 51.608, "end": 54.691, "words": [["five", 51.608], ["models", 52.008], ["one", 52.888], ["mac", 53.128], ["taking", 53.928], ["turns", 54.328]]}}};
    const LEN = CUES.length;
    const SLOT = CUES.slot;
    const L = (id) => CUES.lines[id].start;
    const E = (id) => CUES.lines[id].end;
    const W = (id, word, nth = 1) => {
      const hits = CUES.lines[id].words.filter((said) => said[0] === word.toLowerCase());
      if (hits.length < nth) throw new Error(`no cue ${id}/${word}`);
      return hits[nth - 1][1];
    };
    gsap.config({ force3D: false }); // 2D transforms, so type stays sharp under a camera move
    /* cues:end */
    const tl = gsap.timeline({ paused: true });
    const $ = (selector) => document.querySelector(selector);
    const all = (selector) => gsap.utils.toArray(selector);
    const PAPER = "#eafffa";
    const AMBER = "#fbbf24";

    // Appear and leave: opacity only, so type under the camera stays sharp.
    const show = (target, at, duration = 0.15) =>
      tl.fromTo(target, { opacity: 0 }, { opacity: 1, duration, ease: "power2.out" }, at);
    const hide = (target, at, duration = 0.2) =>
      tl.fromTo(target, { opacity: 1 }, { opacity: 0, duration, ease: "power2.in", immediateRender: false }, at);
    // A stack of states, one visible at a time: [[when, text], ...].
    const states = (host, entries) => {
      entries.forEach(([at, text], index) => {
        const state = document.createElement("span");
        state.textContent = text;
        host.appendChild(state);
        tl.set(state, { opacity: 1 }, at);
        if (index + 1 < entries.length) tl.set(state, { opacity: 0 }, entries[index + 1][0]);
      });
    };
    const clock = (seconds) => `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;

    // ---------------------------------------------------------------- the stage's data
    // Shelf: left and width of each file (125 px a gigabyte). Tower: where it stands at the start.
    const FILES = {
      asr: { x: 330, w: 309, tower: [421, 401] },
      nemo: { x: 663, w: 25, tower: [500, 217] },
      think: { x: 712, w: 343, tower: [405.6, 585] },
      gemma: { x: 1079, w: 481, tower: [343.5, 769] },
      embed: { x: 1584, w: 39, tower: [590, 217] },
    };
    const SHELF_TOP = 762;
    const DESK_TOP = 350; // where a copy stands on the desk
    const TOWER_SCALE = 0.9;
    const SINK = 12; // the shelf settles this far when the laptop grows into the stage
    // Desk: where each copy docks, and how wide it is there (105 px a gigabyte).
    const COPIES = {
      "c-nemo": { slot: 160, w: 28, file: "nemo" },
      "c-asr": { slot: 204, w: 259, file: "asr" },
      "c-think": { slot: 160, w: 288, file: "think" },
      "c-gemma": { slot: 160, w: 404, file: "gemma" },
      "c-think2": { slot: 580, w: 288, file: "think" },
      "c-embed": { slot: 160, w: 33, file: "embed" },
    };
    // A copy's state while it still sits on its file.
    const home = (id) => {
      const copy = COPIES[id];
      const file = FILES[copy.file];
      return { x: file.x - copy.slot, y: SHELF_TOP - DESK_TOP, scaleX: file.w / copy.w, scaleY: 190 / 260 };
    };
    for (const id of Object.keys(COPIES)) gsap.set("#" + id, { transformOrigin: "0 0", opacity: 0, ...home(id) });
    const rise = (id, at, duration = 0.6) => {
      const from = home(id);
      const copy = "#" + id;
      tl.set(copy, { opacity: 1 }, at);
      // Across first, then up: the copy runs along under the desk and comes up into its place,
      // so it never crosses what the desk is showing.
      tl.fromTo(copy, { x: from.x }, { x: 0, duration, ease: "power3.out", immediateRender: false }, at);
      tl.fromTo(copy, { y: from.y }, { y: 0, duration, ease: "power2.inOut", immediateRender: false }, at);
      tl.fromTo(copy, { scaleX: from.scaleX, scaleY: from.scaleY },
        { scaleX: 1, scaleY: 1, duration, ease: "power2.inOut", immediateRender: false }, at);
      return at + duration;
    };
    const drop = (id, at, duration = 0.35) => {
      const copy = "#" + id;
      tl.fromTo(copy, { x: 0, y: 0, scaleX: 1, scaleY: 1 },
        { ...home(id), duration, ease: "power3.in", immediateRender: false }, at);
      tl.set(copy, { opacity: 0 }, at + duration);
      return at + duration;
    };
    const named = (id, at) => tl.fromTo(`#${id} .tt-name`, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "power2.out", immediateRender: false }, at);
    const unnamed = (id, at) => tl.set(`#${id} .tt-name`, { opacity: 0 }, at);
    const working = (id, from, to) => {
      tl.set(`#${id} .tt-edge`, { opacity: 1 }, from);
      tl.set(`#${id} .tt-edge`, { opacity: 0 }, to);
    };

    // Seeded noise for the waveforms.
    let seed = 20261110;
    const noise = () => {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    };
    // Who speaks when, in bars of the two tracks (92 bars, 10 px apart).
    const TURNS = { mic: [[2, 16], [46, 60], [70, 82]], sys: [[19, 43], [63, 67], [85, 91]] };
    for (const [track, color] of [["mic", "#6ef2dc"], ["sys", PAPER]]) {
      for (let bar = 0; bar < 92; bar++) {
        const speaking = TURNS[track].some(([from, to]) => bar >= from && bar <= to);
        const height = speaking ? 18 + Math.round(noise() * 56) : 4;
        const mark = document.createElement("i");
        mark.style.cssText = `position:absolute;left:${bar * 10}px;top:${40 - height / 2}px;width:6px;height:${height}px;border-radius:3px;background:${color}`;
        $("#strip-" + track).appendChild(mark);
      }
      for (const [from, to] of TURNS[track]) {
        const turn = document.createElement("i");
        turn.style.cssText = `position:absolute;left:${from * 10}px;top:0;width:${(to - from + 1) * 10 - 4}px;height:10px;border-radius:5px;background:${color}`;
        $("#segs-" + track).appendChild(turn);
      }
    }

    // ---------------------------------------------------------------- c01: the tower and the laptop
    for (const [id, file] of Object.entries(FILES)) {
      gsap.set("#f-" + id, { transformOrigin: "0 0", x: file.tower[0] - file.x, y: file.tower[1] - SHELF_TOP, scale: TOWER_SCALE });
    }
    gsap.set(".tt-file .tt-size, .tt-flag b, .tt-flag span, .tt-leader, .tt-tag", { opacity: 0 });
    gsap.set("#budget-zone", { opacity: 0 });
    gsap.set("#lb-mem, #lb-disk, #lb-disk-sub, #rec, .tt-trk, #notes, .tt-note, #bubble, #field, #budget, #lb-budget, #lb-queue, .tt-tk, #tk-answer, #st-arrow, .tt-cdt, .tt-cdb, .tt-who, .ck-ev", { opacity: 0 });
    gsap.set("#ev-call", { opacity: 1 });
    gsap.set("#st-desk", { opacity: 0 });
    // The two smallest files land on the tower as the film opens, and are named as they land.
    tl.fromTo("#f-nemo", { y: FILES.nemo.tower[1] - SHELF_TOP - 190 },
      { y: FILES.nemo.tower[1] - SHELF_TOP, duration: 0.3, ease: "power3.in" }, 0.12);
    show("#tw-nemo, #twl-nemo", 0.4);
    tl.fromTo("#f-embed", { y: FILES.embed.tower[1] - SHELF_TOP - 190 },
      { y: FILES.embed.tower[1] - SHELF_TOP, duration: 0.3, ease: "power3.in" }, 0.5);
    show("#tw-embed, #twl-embed", 0.78);
    // The question, in two parts, as the voice gets to each.
    const question = all(".tt-qw");
    [[0, W("c01", "five")], [1, W("c01", "five") + 0.09], [2, W("c01", "one")], [3, W("c01", "one") + 0.09]].forEach(([word, at]) => {
      tl.fromTo(question[word], { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, at - 0.04);
    });
    // The laptop's height, carried across to the tower: everything above the line is too much.
    tl.fromTo("#tt-rule", { clipPath: "inset(0% 0% 0% 100%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "power2.out" }, W("c01", "mac") - 0.05);

    // ---------------------------------------------------------------- c02: files on a shelf, a desk above it
    const answer = W("c02", "doesn't");
    question.forEach((word, index) => {
      tl.fromTo(word, { opacity: 1, filter: "blur(0px)" },
        { opacity: 0, filter: "blur(6px)", duration: 0.2, ease: "power2.in", immediateRender: false }, answer - 0.05 + index * 0.03);
    });
    hide(".tt-tw, .tt-twl", answer - 0.05);
    tl.fromTo("#tt-rule", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, answer - 0.05);
    // Into the Mac: the laptop's screen grows past the frame, and the shelf it stood on runs the full width.
    const grow = answer + 0.25;
    tl.fromTo("#st-lapbezel, #st-lapicon", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power2.in" }, grow);
    tl.fromTo("#st-lapbase, #st-lapnotch", { opacity: 1, y: 0 }, { opacity: 0, y: 18, duration: 0.3, ease: "power2.in" }, grow);
    tl.fromTo("#st-screen", { attr: { x: 1116, y: 564, width: 548, height: 338, rx: 8 } },
      { attr: { x: -60, y: -60, width: 2040, height: 1200, rx: 0 }, duration: 0.7, ease: "power2.inOut" }, grow);
    tl.fromTo("#st-screen", { fill: "#1b4a44" }, { fill: "#143a35", duration: 0.35, ease: "power1.inOut" }, grow + 0.5);
    tl.set("#st-screen", { opacity: 0 }, grow + 0.9);
    tl.fromTo("#st-ledge", { attr: { x: 200, y: 940, width: 1560 } },
      { attr: { x: 120, y: 940 + SINK, width: 1680 }, duration: 0.8, ease: "power2.inOut" }, grow);
    for (const [id, file] of Object.entries(FILES)) {
      tl.fromTo("#f-" + id, { y: file.tower[1] - SHELF_TOP }, { y: file.tower[1] - SHELF_TOP + SINK, duration: 0.8, ease: "power2.inOut", immediateRender: false }, grow);
    }
    // The tower comes apart: one file after another flies to its place on the shelf, the last landing on "disk".
    const apart = W("c02", "the") + 0.1;
    const FLIGHT = 0.55;
    const NEXT = (W("c02", "disk") - FLIGHT - apart) / 4;
    ["gemma", "think", "asr", "embed", "nemo"].forEach((id, index) => {
      const file = FILES[id];
      const at = apart + index * NEXT;
      tl.fromTo("#f-" + id, { x: file.tower[0] - file.x, scale: TOWER_SCALE },
        { x: 0, scale: 1, duration: FLIGHT, ease: "power2.inOut", immediateRender: false }, at);
      tl.fromTo("#f-" + id, { y: file.tower[1] - SHELF_TOP + SINK },
        { y: 0, duration: FLIGHT, ease: "power3.inOut", immediateRender: false }, at);
    });
    show("#fl-embed b, #fll-embed", apart + 3 * NEXT + FLIGHT);
    show("#fl-nemo b, #fll-nemo", apart + 4 * NEXT + FLIGHT);
    show("#lb-disk", W("c02", "disk") + 0.1);
    ["#f-asr .tt-size", "#fl-nemo span", "#f-think .tt-size", "#f-gemma .tt-size", "#fl-embed span"].forEach((size, index) => {
      show(size, W("c02", "ten") + index * 0.06);
    });
    tl.fromTo("#big-n", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, W("c02", "ten") - 0.04);
    tl.fromTo("#big-sub", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out" }, W("c02", "ten") + 0.14);
    // Memory: the number has had its read; it makes way, and the desk is drawn over the shelf.
    const desk = W("c02", "and") + 0.3;
    tl.fromTo("#big-n, #big-sub", { opacity: 1, filter: "blur(0px)" },
      { opacity: 0, filter: "blur(8px)", duration: 0.2, ease: "power2.in", immediateRender: false }, desk - 0.2);
    show("#lb-disk-sub", desk);
    tl.set("#st-desk", { opacity: 1 }, desk);
    tl.fromTo("#st-desk", { strokeDashoffset: 4300 }, { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, desk);
    tl.fromTo("#st-desk", { fillOpacity: 0 }, { fillOpacity: 1, duration: 0.25, ease: "power1.out" }, desk + 0.1);
    // Two files show the move once: up to the desk, down again.
    const turn1 = W("c02", "turns") - 0.05;
    rise("c-think", turn1, 0.3);
    drop("c-think", turn1 + 0.35, 0.22);
    const turn2 = turn1 + 0.4;
    rise("c-gemma", turn2, 0.3);
    drop("c-gemma", turn2 + 0.35, 0.22);
    show("#lb-mem", W("c02", "memory"));

    // ---------------------------------------------------------------- the clock
    const PX = 28; // px a minute
    const minute = (hour, min) => (hour - 9) * 60 + min; // minutes since 09:00
    const hhmm = (m) => `${9 + Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}`;
    const tapeX = (m) => 960 - m * PX - 1;
    for (let m = 30; m <= 570; m += 10) {
      const label = document.createElement("span");
      label.textContent = hhmm(m);
      label.className = "ck-label" + (m % 60 === 0 ? " ck-hour" : "");
      label.style.left = `${m * PX - 42}px`;
      $("#ck-tape").appendChild(label);
    }
    const TAPE = ["#ck-tape", "#ck-events"];
    gsap.set(TAPE, { x: tapeX(minute(10, 0)) });
    const readout = [];
    // Slide the tape from one minute to another; the readout follows in whole steps.
    const run = (from, to, at, duration, ease, step, inverse) => {
      tl.fromTo(TAPE, { x: tapeX(from) }, { x: tapeX(to), duration, ease, immediateRender: false }, at);
      for (let m = Math.ceil((from + 0.001) / step) * step; m <= to; m += step) {
        readout.push([at + duration * inverse((m - from) / (to - from)), hhmm(m)]);
      }
      if (to % step) readout.push([at + duration, hhmm(to)]);
    };
    const linear = (f) => f;
    const inOut2 = (f) => (f < 0.5 ? Math.sqrt(f / 2) : 1 - Math.sqrt((1 - f) / 2));
    const inOut3 = (f) => (f < 0.5 ? Math.cbrt(f / 4) : 1 - Math.cbrt((1 - f) / 4));

    // ---------------------------------------------------------------- c03: the call, and nothing loaded
    const callStart = W("c03", "during") + 0.35;
    const callEnd = E("c03") - 0.1;
    tl.set("#w-clock", { opacity: 1 }, L("c03") - 0.1);
    tl.fromTo("#w-clock", { clipPath: "inset(0% 50% 0% 50%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.5, ease: "power2.out" }, L("c03") - 0.1);
    readout.push([L("c03") - 0.1, "10:00"]);
    run(minute(10, 0), minute(10, 26), callStart, callEnd - callStart, "none", 1, linear);
    tl.set("#ev-hangup", { opacity: 1 }, callEnd);
    // It only records: two tracks draw for as long as the call lasts.
    show("#rec, #trk-mic, #trk-sys", W("c03", "call") - 0.1);
    tl.fromTo("#strip-mic, #strip-sys", { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: callEnd - callStart, ease: "none" }, callStart);
    show("#tag-asr", W("c03", "transcription"));
    show("#tag-gemma", W("c03", "autocomplete"));

    // ---------------------------------------------------------------- c04: the speech models come up, work, and go
    hide("#tag-asr, #tag-gemma, #rec", L("c04") - 0.1);
    const WIDE = { x: 0, y: 0, scale: 1 };
    const CLOSE = { x: -64, y: -44, scale: 1.15 };
    tl.fromTo("#w-world", WIDE, { ...CLOSE, duration: 0.9, ease: "power2.inOut" }, L("c04") + 0.05);
    const speechUp = W("c04", "load") - 0.35;
    rise("c-nemo", speechUp);
    const asrDocked = rise("c-asr", speechUp + 0.1);
    show("#cfl-nemo, #cfll-nemo", speechUp + 0.55);
    named("c-asr", asrDocked - 0.05);
    // Nemotron first: who spoke when, on both tracks.
    working("c-nemo", W("c04", "turn"), W("c04", "transcript") - 0.1);
    tl.fromTo("#segs-mic, #segs-sys", { clipPath: "inset(0% 100% 0% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power1.inOut" }, W("c04", "turn"));
    // Then Qwen3-ASR: the tracks become lines of text, and each line gets its speaker.
    const writing = W("c04", "transcript") - 0.1;
    gsap.set(".tt-said", { color: AMBER }); // a line is amber while it is being written
    working("c-asr", writing, W("c04", "two") - 0.08);
    hide("#trk-mic, #trk-sys, #strip-mic, #strip-sys, #segs-mic, #segs-sys", writing - 0.05, 0.25);
    [1, 2, 3, 4].forEach((line, index) => {
      const at = writing + 0.12 + index * 0.2;
      tl.fromTo(`#trl-${line} .tt-said`, { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.34, ease: "none" }, at);
      tl.fromTo(`#trl-${line} .tt-said`, { color: AMBER }, { color: PAPER, duration: 0.2, ease: "power1.out", immediateRender: false }, at + 0.34);
      show(`#trl-${line} .tt-who`, W("c04", "speakers") + index * 0.07);
    });
    readout.push([W("c04", "transcript"), "10:27"]);
    tl.fromTo(TAPE, { x: tapeX(minute(10, 26)) }, { x: tapeX(minute(10, 27)), duration: 0.4, ease: "power2.inOut", immediateRender: false }, W("c04", "transcript") - 0.2);
    // Two minutes idle, then they unload.
    const wait1 = W("c04", "two") + 0.15;
    const gone1 = W("c04", "unload") - 0.2;
    tl.set("#cd-speech", { opacity: 1 }, W("c04", "two"));
    hide("#cfll-nemo", W("c04", "two") - 0.1, 0.1); // the countdown takes the leader's place
    show("#cdt-speech, #cdb-speech", W("c04", "two"));
    states($("#cd-speech"), [[W("c04", "two"), "2:00"]].concat(
      Array.from({ length: 12 }, (_, k) => [wait1 + ((gone1 - wait1) * (k + 1)) / 12, clock(110 - k * 10)])));
    tl.fromTo("#cdb-speech", { scaleX: 1 }, { scaleX: 0, duration: gone1 - wait1, ease: "none" }, wait1);
    run(minute(10, 27), minute(10, 29), wait1, gone1 - wait1, "none", 1, linear);
    const speechDown = W("c04", "unload");
    tl.set("#cd-speech", { opacity: 0 }, speechDown);
    hide("#cdt-speech, #cfl-nemo", speechDown, 0.15);
    unnamed("c-asr", speechDown);
    drop("c-asr", speechDown);
    drop("c-nemo", speechDown + 0.06);

    // ---------------------------------------------------------------- c05: the language model writes the notes, waits, leaves
    const thinkUp = W("c05", "language") - 0.1;
    const thinkDocked = rise("c-think", thinkUp);
    named("c-think", thinkDocked - 0.05);
    working("c-think", thinkDocked, W("c05", "stays") - 0.08);
    const notesAt = W("c05", "writes") - 0.1;
    tl.set("#notes", { opacity: 1 }, notesAt);
    tl.fromTo("#notes", { clipPath: "inset(0% 0% 100% 0% round 14px)" },
      { clipPath: "inset(0% 0% 0% 0% round 14px)", duration: 0.35, ease: "power2.out" }, notesAt);
    [1, 2, 3].forEach((part, index) => {
      const at = notesAt + 0.35 + index * 0.32;
      tl.fromTo(`#nh-${part}`, { opacity: 0 }, { opacity: 1, duration: 0.13, ease: "power2.out" }, at);
      tl.fromTo(`#nb-${part}`, { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, at + 0.08);
      tl.to(`#nb-${part}`, { backgroundColor: "#9db8b2", duration: 0.25, ease: "power1.out" }, W("c05", "stays") - 0.08);
    });
    show("#tag-notes", W("c05", "notes"));
    readout.push([W("c05", "writes") + 0.4, "10:30"]);
    tl.fromTo(TAPE, { x: tapeX(minute(10, 29)) }, { x: tapeX(minute(10, 30)), duration: 0.4, ease: "power2.inOut", immediateRender: false }, W("c05", "writes") + 0.2);
    // Ten minutes, in case a follow-up comes.
    const wait2 = W("c05", "stays") + 0.15;
    const gone2 = W("c05", "leaves") - 0.3;
    tl.set("#cd-think", { opacity: 1 }, W("c05", "stays"));
    show("#cdt-think, #cdb-think", W("c05", "stays"));
    states($("#cd-think"), [[W("c05", "stays"), "10:00"]].concat(
      Array.from({ length: 20 }, (_, k) => [wait2 + ((gone2 - wait2) * (k + 1)) / 20, clock(570 - k * 30)])));
    tl.fromTo("#cdb-think", { scaleX: 1 }, { scaleX: 0, duration: gone2 - wait2, ease: "none" }, wait2);
    run(minute(10, 30), minute(10, 40), wait2, gone2 - wait2, "none", 1, linear);
    tl.fromTo("#bubble", { opacity: 0, scale: 0.6, transformOrigin: "0% 100%" },
      { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, W("c05", "follow-up"));
    hide("#bubble", W("c05", "follow-up") + 0.55, 0.15);
    const thinkDown = W("c05", "leaves");
    tl.set("#cd-think", { opacity: 0 }, thinkDown);
    hide("#cdt-think, .tt-trl, #notes, #tag-notes", thinkDown - 0.05, 0.2);
    unnamed("c-think", thinkDown);
    drop("c-think", thinkDown);

    // ---------------------------------------------------------------- c06: autocomplete stays, and answers every key
    const whip1 = W("c05", "leaves") + 0.25;
    run(minute(10, 40), minute(11, 40), whip1, 0.4, "power3.inOut", 10, inOut3);
    tl.set("#ev-typing", { opacity: 1 }, whip1 + 0.4);
    const gemmaUp = W("c06", "autocomplete") - 0.1;
    const gemmaDocked = rise("c-gemma", gemmaUp);
    named("c-gemma", gemmaDocked - 0.05);
    show("#cdt-gemma", W("c06", "stays"));
    // A sentence typed in any app: each key is answered, the suggestion always one step ahead.
    const SENTENCE = "The offsite is in Lisbon, May 12 to 14.";
    const TYPED = 17;
    const firstKey = W("c06", "because");
    const lastKey = W("c06", "keystroke") + 0.75;
    const keyAt = (key) => firstKey + ((lastKey - firstKey) * (key - 1)) / (TYPED - 1); // key: 1 to TYPED
    const carets = [];
    const chars = [];
    const text = $("#field-text");
    const caret = () => {
      const mark = document.createElement("i");
      mark.className = "tt-caret";
      text.appendChild(mark);
      carets.push(mark);
    };
    caret();
    [...SENTENCE].forEach((letter, index) => {
      const char = document.createElement("span");
      char.className = "tt-ch";
      char.textContent = letter;
      text.appendChild(char);
      chars.push(char);
      if (index < TYPED) caret();
    });
    const fieldAt = W("c06", "room") + 0.15;
    show("#field", fieldAt, 0.2);
    tl.set(carets[0], { opacity: 1 }, fieldAt);
    for (let key = 1; key <= TYPED; key++) {
      const at = keyAt(key);
      tl.set(chars[key - 1], { opacity: 1, color: PAPER }, at);
      tl.set(carets[key - 1], { opacity: 0 }, at);
      tl.set(carets[key], { opacity: 1 }, at);
      working("c-gemma", at + 0.02, at + 0.1);
    }
    tl.set(chars.slice(1), { opacity: 1 }, keyAt(1) + 0.06); // the first suggestion, 56 ms after the first key
    show("#tag-keys", W("c06", "fifty"));
    readout.push([W("c06", "because"), "11:41"]);
    tl.fromTo(TAPE, { x: tapeX(minute(11, 40)) }, { x: tapeX(minute(11, 41)), duration: 0.4, ease: "power2.inOut", immediateRender: false }, W("c06", "because") - 0.2);

    // ---------------------------------------------------------------- c07: the broker's budget and its queue
    const afternoon = E("c06") + 0.05;
    hide("#field, #tag-keys, #cdt-gemma", afternoon - 0.05, 0.2);
    run(minute(11, 41), minute(15, 10), afternoon, 0.45, "power3.inOut", 30, inOut3);
    tl.set("#ev-question", { opacity: 1 }, afternoon + 0.45);
    tl.fromTo("#w-world", CLOSE, { ...WIDE, duration: 0.9, ease: "power2.inOut", immediateRender: false }, afternoon);
    // Half of the desk is tinted from the left up to a dashed line: that much, and no more.
    const budgeted = W("c07", "half") - 0.25;
    tl.set("#budget-zone", { opacity: 1 }, budgeted);
    tl.fromTo("#budget-zone", { clipPath: "inset(0% 100% 0% 0% round 22px 0px 0px 22px)" },
      { clipPath: "inset(0% 0% 0% 0% round 22px 0px 0px 22px)", duration: 0.45, ease: "power2.inOut" }, budgeted);
    tl.set("#budget", { opacity: 1 }, budgeted + 0.3);
    tl.fromTo("#budget", { clipPath: "inset(0% 0% 100% 0%)" },
      { clipPath: "inset(0% 0% 0% 0%)", duration: 0.35, ease: "power2.out" }, budgeted + 0.3);
    show("#lb-budget", W("c07", "half") + 0.2);
    readout.push([W("c07", "models"), "15:11"]);
    tl.fromTo(TAPE, { x: tapeX(minute(15, 10)) }, { x: tapeX(minute(15, 11)), duration: 0.4, ease: "power2.inOut", immediateRender: false }, W("c07", "models") - 0.2);
    // Background work was first in the queue; what the person is waiting for passes it.
    const queued = W("c07", "models") + 0.1;
    show("#lb-queue", queued);
    tl.set("#tk-digest", { opacity: 1 }, queued);
    tl.fromTo("#tk-digest", { x: 960 }, { x: 0, duration: 0.5, ease: "expo.out" }, queued);
    const asked = W("c07", "what") - 0.05;
    tl.set("#tk-question", { opacity: 1 }, asked);
    tl.fromTo("#tk-question", { x: 560 }, { x: 0, duration: 0.5, ease: "expo.out" }, asked);
    const pass = W("c07", "goes") - 0.05;
    tl.fromTo("#tk-question", { x: 0 }, { x: -400, duration: 0.5, ease: "power2.inOut", immediateRender: false }, pass);
    tl.fromTo("#tk-question", { y: 0 }, { y: -104, duration: 0.25, ease: "power2.out" }, pass);
    tl.fromTo("#tk-question", { y: -104 }, { y: 0, duration: 0.25, ease: "power2.in", immediateRender: false }, pass + 0.25);
    tl.fromTo("#tk-digest", { x: 0 }, { x: 400, duration: 0.5, ease: "power2.inOut", immediateRender: false }, pass + 0.05);
    const think2Up = pass + 0.35;
    const think2Docked = rise("c-think2", think2Up);
    named("c-think2", think2Docked - 0.05);
    working("c-think2", think2Docked, L("c08") - 0.3);
    show("#st-arrow", think2Docked);
    tl.set("#tk-answer", { opacity: 1 }, think2Docked);
    tl.fromTo("#tk-answer", { scaleX: 0 }, { scaleX: 1, duration: Math.max(0.3, E("c07") - think2Docked), ease: "none" }, think2Docked);

    // ---------------------------------------------------------------- c08: the day at rest
    const rest = L("c08") - 0.3; // the desk is clear before the line lands in it
    hide("#budget, #budget-zone, #lb-budget, #lb-queue, #tk-digest, #tk-question, #tk-answer, #st-arrow", rest, 0.2);
    unnamed("c-think2", rest);
    unnamed("c-gemma", rest);
    drop("c-think2", rest, 0.28);
    drop("c-gemma", rest + 0.06, 0.28);
    const evening = W("c08", "taking") + 0.1;
    run(minute(15, 11), minute(18, 0), rest + 0.1, evening - rest - 0.1, "power2.inOut", 10, inOut2);
    [["five", 0.08], ["one", -0.04], ["taking", -0.04]].forEach(([word, offset], index) => {
      tl.fromTo(all(".tt-l8")[index], { opacity: 0, filter: "blur(6px)" },
        { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, W("c08", word) + offset);
    });
    // Once more, one after another: each file up and down, amber while it is up.
    const wave = W("c08", "taking") - 0.05;
    const HOP = 96;
    const BEAT = 0.2;
    ["c-embed", "c-gemma", "c-think", "c-nemo", "c-asr"].forEach((id, index) => {
      const copy = "#" + id;
      const from = home(id);
      const at = wave + index * BEAT;
      tl.set(copy, { opacity: 1, ...from }, at);
      working(id, at, at + BEAT);
      tl.fromTo(copy, { y: from.y }, { y: from.y - HOP, duration: BEAT / 2, ease: "power2.out", immediateRender: false }, at);
      tl.fromTo(copy, { y: from.y - HOP }, { y: from.y, duration: BEAT / 2, ease: "power2.in", immediateRender: false }, at + BEAT / 2);
      tl.set(copy, { opacity: 0 }, at + BEAT);
    });
    // The last one's amber edge closes into the dot the end card takes over.
    const last = wave + 4 * BEAT + BEAT / 2; // Qwen3-ASR at the top of its move
    const edge = { x: FILES.asr.x + FILES.asr.w / 2 - 776, y: SHELF_TOP - HOP + 6 - 650.5, scaleX: FILES.asr.w / 50, scaleY: 12 / 50 };
    tl.set("#c-asr .tt-edge", { opacity: 0 }, last);
    tl.set("#w-dot", { opacity: 1, ...edge }, last);
    tl.fromTo("#w-dot", edge, { x: 0, y: 0, scaleX: 1, scaleY: 1, duration: 0.3, ease: "power2.inOut", immediateRender: false }, last);

    // The clock's readout, from everything above.
    readout.sort((a, b) => a[0] - b[0]);
    states($("#ck-time"), readout);

    tl.set({}, {}, LEN);
    window.__timelines["world"] = tl;
  </script>
</template>
