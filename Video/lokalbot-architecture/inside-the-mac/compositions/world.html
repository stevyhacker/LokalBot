n", 38.378], ["one", 38.618], ["folder", 38.898], ["plain", 40.018], ["files", 40.258], ["and", 41.098], ["a", 41.218], ["single", 41.378], ["database", 41.698], ["for", 42.338], ["search", 42.578]]}, "b08": {"start": 43.3, "end": 51.743, "words": [["model", 43.3], ["files", 43.7], ["and", 44.18], ["updates", 44.34], ["come", 44.98], ["in", 45.22], ["your", 46.14], ["work", 46.42], ["goes", 46.66], ["out", 46.9], ["only", 47.3], ["where", 47.7], ["you", 47.94], ["send", 48.1], ["it", 48.42], ["a", 49.06], ["remote", 49.34], ["model", 49.86], ["an", 50.287], ["agent", 50.42], ["your", 51.22], ["phone", 51.82]]}, "b09": {"start": 51.943, "end": 54.543, "words": [["close", 51.943], ["it", 52.263], ["up", 52.423], ["and", 52.983], ["it's", 53.103], ["all", 53.383], ["still", 53.703], ["in", 54.103], ["there", 54.423]]}}};

    const O2 = [712, 470]; // and once it is open, with the layer names at its right

    const O4 = [877, 396]; // closed again, at 0.8
    const APP_WALL = { x: 10.4, y: -402, rotation: 0, skewX: 0, skewY: 30, scaleX: 0.8345, scaleY: 0.9636 };
    const APP_FLAT = { x: 0, y: -420, rotation: 30, skewX: -30, skewY: 0, scaleX: 1, scaleY: 0.866 };
    const LIB = [-121, 300]; // the front of the library folder, from the base's back corner
    const FLAT_Y = 170; // the board sits mid-frame while the files seat, then moves up for the sizes
