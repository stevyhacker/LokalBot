    });
    const scatter = seeded(99);
    for (let i = 0; i < 46; i += 1) {
      const x = 40 + scatter() * 680;
      const y = 80 + scatter() * 390;
      const size = 10 + Math.round(scatter() * 6);
      // keep the landing place and its three names clear
      if (x > 100 && x < 700 && y > 150 && y < 370) continue;
      const dot = document.createElement("i");
      dot.style.cssText = `left:${x}px;top:${y}px;width:${size}px;height:${size}px`;
      $("#db-vec").appendChild(dot);
    }
    [[413, 198], [443, 323], [183, 338]].forEach(([x, y]) => {
      const dot = document.createElement("i");
      dot.style.cssText = `left:${x}px;top:${y}px;width:14px;height:14px`;
      $("#db-vec").appendChild(dot);
    });

    // ---- when the camera leaves each station ----
    const T = {
      tracks: E("a01") - 0.07,
      speakers: L("a03") - 0.25,
      words: L("a04") - 0.66,
      notes: L("a05") - 0.1,
      meaning: L("a06") - 0.3,
      database: W("a06", "meaning") + 0.25,
      typing: L("a07") + 0.15,
      agent: L("a08") - 0.12,
      pull: L("a09") - 0.3,
      out: E("a09") + 0.1,
    };
    const trace = (at, length, duration, ease = "power2.inOut") => go("#w-trace", at, { strokeDashoffset: 12000 - length }, duration, ease);
    put("#w-trace", { strokeDashoffset: 12000 });

    // ---- the camera ----
    put("#w-world", { x: 0, y: -214, scale: 1.45 });
    go("#w-world", 0, { y: -136, scale: 1.3 }, 1.4, "power2.out");
    go("#w-world", W("a01", "let's") - 0.55, { x: 0, y: 0, scale: 1 }, 0.8);
    go("#w-world", T.tracks, { x: -1920 }, 0.9);
    go("#w-world", T.speakers, { x: -3020 }, 0.9);
    go("#w-world", T.words + 0.05, { x: -3840 }, 0.75);
    go("#w-world", T.words + 0.5, { y: -1080 }, 0.75);
    go("#w-world", T.notes, { y: -2160 }, 0.9);
    go("#w-world", T.meaning, { x: -1920 }, 0.9);
    go("#w-world", T.database, { y: -1080 }, 0.9);
    go("#w-world", T.typing, { x: 0 }, 0.9);
    go("#w-world", T.agent, { y: -2160 }, 0.9);
    go("#w-world", T.pull, { x: 312, y: 97.5, scale: 0.225 }, 1.4);

    // ---- 1. CALL: she says it, and it is captioned ----
    const level = seeded(3);
    $$("#s1-level i").forEach((bar) => {
      let last = 0.25 + 0.5 * level();
      gsap.set(bar, { scaleY: last });
      for (let t = 0; t < W("a01", "follow") - 0.4; t += 0.17) {
        const next = 0.2 + 0.8 * level();
        tl.fromTo(bar, { scaleY: last }, { scaleY: next, duration: 0.17, ease: "sine.inOut", immediateRender: false }, t);
        last = next;
      }
      tl.fromTo(bar, { scaleY: last }, { scaleY: 0.12, duration: 0.3, ease: "power2.out", immediateRender: false }, W("a01", "follow") - 0.4);
    });
    gsap.set(".cw", { opacity: 0 });
    $$(".cw").forEach((word, i) => tl.set(word, { opacity: 1 }, W("a01", "says") + 0.04 + i * 0.17));
    blurIn(".qw", W("a01", "let's") + 0.12, 0.14);
    // The caption closes into the capsule and leaves along the band; the camera goes with it.
    const leave = T.tracks - 0.12;
    tl.to("#s1-cap", { opacity: 0, duration: 0.12, ease: "none" }, leave);
    put("#w-cap", { opacity: 0, x: 196, y: 728, scaleX: 2.02, scaleY: 0.533 });
    jump("#w-cap", leave, { opacity: 1 });
    gsap.set("#cap-bars", { opacity: 0 });
    tl.to("#cap-bars", { opacity: 1, duration: 0.25, ease: "power2.out" }, leave + 0.12);
    go("#w-cap", leave, { scaleX: 1, scaleY: 1 }, 0.4);
    go("#w-cap", leave + 0.35, { y: 480 }, 0.5);
    go("#w-cap", leave, { x: 2624 }, 1.1);
    trace(leave + 0.3, 1920, 0.8);

    // ---- 2. TRACKS: it is only sound ----
    put("#cap-head", { opacity: 0, x: 10 });
    const play = T.tracks + 1.05;
    jump("#cap-head", play, { opacity: 1 });
    go("#cap-head", play, { x: 496 }, W("a02", "two") - play, "none");
    jump("#cap-head", W("a02", "two"), { opacity: 0, x: 10 });
    blurIn("#s2-nobot", W("a02", "sound") + 0.3);
    const lanes = W("a02", "two") - 0.1;
    put(".bars", { clipPath: "inset(0px 1900px 0px 0px)" });
    go(".bars", lanes + 0.25, { clipPath: "inset(0px 1184px 0px 0px)" }, 0.9, "power1.inOut");
    const dock = W("a02", "tracks") + 0.95;
    go("#w-cap", dock, { x: 3184, y: 635 }, 0.45);
    go(".bars", dock + 0.4, { clipPath: "inset(0px 124px 0px 0px)" }, W("a03", "ends") - (dock + 0.4), "none");
    wipe("#rec-n1", W("a02", "microphone") - 0.3);
    wipe("#rec-a1", W("a02", "microphone") - 0.1);
    wipe("#rec-n2", W("a02", "call") - 0.2);
    wipe("#rec-a2", W("a02", "call"));

    // ---- 3. SPEAKERS: who spoke when ----
    tl.fromTo("#rec-end", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "power3.out" }, W("a03", "ends"));
    tl.fromTo("#rec-stop", { scale: 0 }, { scale: 1, duration: 0.3, ease: "back.out(1.4)" }, W("a03", "ends") + 0.1);
    const scan = W("a03", "speaker") - 0.05;
    put("#rec-scan", { opacity: 0, x: 970 });
    jump("#rec-scan", scan, { opacity: 1 });
    go("#rec-scan", scan, { x: 2190 }, 0.9, "power1.inOut");
    tl.fromTo("#rec-scan", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in", immediateRender: false }, scan + 0.9);
    put(".turns", { clipPath: "inset(0px 1334px 0px 0px)", opacity: 0 });
    jump(".turns", scan, { opacity: 1 });
    go(".turns", scan, { clipPath: "inset(0px 114px 0px 0px)" }, 0.9, "power1.inOut");
    blurIn("#rec-maya", W("a03", "who"));
    blurIn("#rec-you", W("a03", "spoke"));
    wipe("#p-nemo", W("a03", "speaker") - 0.35);
    // The amber stretch drops out of the lane and travels down.
    const drop = T.words;
    go("#w-cap", drop, { x: 4544 }, 0.7);
    go("#w-cap", drop, { y: 480 }, 0.3, "power2.out");
    go("#w-cap", drop + 0.5, { y: 1560 }, 0.75);
    trace(drop + 0.15, 3840, 0.5, "power2.in");
    trace(drop + 0.65, 4920, 0.6, "power2.out");

    // ---- 4. WORDS: sound into words, each with its time ----
    const listen = W("a04", "turns") - 0.1;
    jump("#cap-head", listen, { opacity: 1 });
    go("#cap-head", listen, { x: 496 }, W("a04", "words") - 0.2 - listen, "none");
    wipe("#p-asr", T.words + 1.2);
    put("#w-sent", { opacity: 0, x: 0, y: 0, scale: 1, clipPath: "inset(5px 504px 5px 504px round 20px)" });
    gsap.set(["#sent-words .tok", "#sent-words .time"], { opacity: 0 });
    gsap.set("#sent-words .tok", { filter: "blur(6px)" });
    gsap.set("#sent-words .tick", { scaleY: 0 });
    const words = W("a04", "words") - 0.15;
    jump("#w-sent", words, { opacity: 1 });
    jump("#w-cap", words, { opacity: 0 });
    go("#w-sent", words, { clipPath: "inset(0px 0px 0px 0px round 24px)" }, 0.45, "expo.out");
    tl.set("#w-sent", { clipPath: "none" }, words + 0.46);
    tl.to("#sent-bars i", { scaleY: 0, duration: 0.22, ease: "power3.in", stagger: 0.008 }, words + 0.1);
    tl.to("#sent-words .tok", { opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power2.out", stagger: 0.07 }, words + 0.3);
    blurIn("#s4-tag", words + 0.3);
    const pin = W("a04", "pinned") - 0.05;
    tl.to("#sent-words .tick", { scaleY: 1, duration: 0.16, ease: "power3.out", stagger: 0.05 }, pin);
    tl.to("#sent-words .time", { opacity: 1, duration: 0.13, ease: "power2.out", stagger: 0.05 }, pin + 0.1);
    wipe("#p-align", W("a04", "each"));
    // It shrinks to a transcript line and goes down into the transcript.
    tl.to(["#sent-words .tick", "#sent-words .time"], { opacity: 0, duration: 0.12, ease: "power3.in" }, T.notes - 0.1);
    go("#w-sent", T.notes, { x: 30, y: 1191, scale: 0.421 }, 0.9);
    trace(T.notes + 0.05, 6000, 0.8);

    // ---- 5. NOTES: the transcript is read, the notes are written ----
    wipe("#p-think", T.notes + 0.85);
    gsap.set("#s5-left", { opacity: 0 });
    put("#s5-read", { opacity: 0, y: 0 });
    const read = W("a05", "reads");
    tl.fromTo("#s5-read", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, read);
    go("#s5-read", read, { y: 546 }, 1.25, "none");
    tl.fromTo("#s5-read", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power3.in", immediateRender: false }, read + 1.25);
    tl.fromTo("#s5-notes", { clipPath: "inset(0% 0% 100% 0% round 24px)" },
      { clipPath: "inset(0% 0% 0% 0% round 24px)", duration: 0.5, ease: "expo.out" }, W("a05", "writes") - 0.2);
    blurIn("#n-h1", W("a05", "decisions") - 0.05);
    const land = W("a05", "decisions") + 0.12;
    go("#w-sent", land, { x: 880, y: 1035 }, 0.5, "expo.out");
    tl.to("#s5-left", { opacity: 1, duration: 0.2, ease: "power2.out" }, land + 0.1);
    blurIn("#n-h2", W("a05", "action") - 0.1);
    wipe("#n-p2", W("a05", "action") + 0.08, 0.45);
    blurIn("#n-h3", W("a05", "open") - 0.1);
    wipe("#n-p3", W("a05", "open") + 0.08, 0.45);
    // The line leaves the notes for the embedding model.
    go("#w-sent", T.meaning, { x: -1480, y: 1118 }, 0.9);
    trace(T.meaning + 0.05, 7920, 0.85);

    // ---- 6. MEANING: the line becomes a vector, then one dot ----
    wipe("#p-embed", W("a06", "embedding"));
    const strip = T.meaning + 0.95;
    fadeOut("#w-sent", strip, 0.1);
    tl.fromTo("#s6-strip i", { scaleY: 0 }, { scaleY: 1, duration: 0.25, ease: "back.out(1.4)", stagger: { each: 0.03, from: "center" } }, strip + 0.06);
    blurIn("#s6-dim", strip + 0.4);
    const point = W("a06", "meaning") - 0.2;
    $$("#s6-strip i").forEach((cell, i) => {
      tl.to(cell, { x: (4.5 - i) * 156, scaleX: 0.3, opacity: 0, duration: 0.3, ease: "power3.in" }, point);
    });
    fadeOut("#s6-dim", point, 0.2);
    put("#dot1", { x: 2880, y: 2700, scale: 0 });
    go("#dot1", point + 0.22, { scale: 1 }, 0.3, "back.out(1.4)");
    go("#dot1", T.database, { y: 1620 }, 0.9);
    trace(T.database, 9000, 0.9);

    // ---- DATABASE: beside a keyword index, in one file ----
    const key = W("a06", "keyword") - 0.1;
    wipe("#db-kt", key);
    blurIn("#db-rows .krow", key + 0.1, 0.06);
    tl.fromTo("#db-mark", { scaleX: 0 }, { scaleX: 1, duration: 0.25, ease: "power3.out" }, W("a06", "index"));
    tl.to("#db-lis", { color: "#0e141c", duration: 0.1, ease: "none" }, W("a06", "index") + 0.05);
    const file = W("a06", "index") + 0.2;
    wipe("#db-vt", file);
    go("#dot1", file + 0.05, { x: 3150, y: 1630 }, 0.4);
    blurIn("#db-vec .near", file + 0.4, 0.08);

    // ---- 7. TYPING: days later, the sentence finishes itself ----
    put("#dot2", { x: 3150, y: 1630, scale: 0 });
    jump("#dot2", T.typing - 0.02, { scale: 1 });
    go("#dot2", T.typing, { x: 960 }, 1.1);
    go("#dot2", T.typing, { y: 1620 }, 0.35, "power2.out");
    trace(T.typing + 0.15, 10920, 0.95);
    const keys = W("a07", "typing") - 0.4;
    const caret = typed("#s7-typed", "The offsite is in", keys, 0.05, T.typing + 0.8);
    gsap.set("#s7-ghost", { clipPath: "inset(0% 100% 0% 0%)" });
    gsap.set("#s7-ghost-bg", { opacity: 0.32 });
    gsap.set("#s7-ghost-tx", { opacity: 0.5 });
    const model = W("a07", "model") - 0.05;
    wipe("#p-gemma", W("a07", "typing"));
    go("#dot2", model, { x: 884, y: 1825 }, 0.4, "power2.in");
    go("#dot2", model + 0.4, { scale: 0.7 }, 0.15, "power2.out");
    [["#s7-b1", 0.3], ["#s7-b2", 0.45], ["#s7-b3", 0.6]].forEach(([bar, late]) => {
      tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, model + late + 0.3);
    });
    const ghost = W("a07", "finishes");
    go("#dot2", ghost - 0.22, { x: 850, y: 1420, scale: 0.4 }, 0.22, "power3.in");
    jump("#dot2", ghost, { scale: 0 });
    tl.to("#s7-ghost", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "power3.out" }, ghost);
    const tab = W("a07", "sentence");
    tl.fromTo("#s7-tab", { y: 0, scale: 1 }, { y: 8, scale: 0.96, duration: 0.07, ease: "power2.in" }, tab);
    tl.fromTo("#s7-tab", { y: 8, scale: 0.96 }, { y: 0, scale: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, tab + 0.07);
    tl.to("#s7-ghost-bg", { opacity: 1, duration: 0.12, ease: "power2.out" }, tab + 0.05);
    tl.to("#s7-ghost-tx", { opacity: 1, duration: 0.12, ease: "power2.out" }, tab + 0.05);
    tl.set(caret, { opacity: 0 }, tab + 0.05);

    // ---- 8. AGENT: only if you allow it ----
    put("#dot3", { x: 960, y: 1935, scale: 0 });
    go("#dot3", T.agent - 0.05, { scale: 1 }, 0.2, "back.out(1.4)");
    go("#dot3", T.agent, { y: 2330 }, 0.9);
    trace(T.agent, 11650, 0.9);
    const allow = W("a08", "allow");
    tl.fromTo("#s8-knob", { x: 0, backgroundColor: "#eafffa" }, { x: 50, backgroundColor: "#6ef2dc", duration: 0.2, ease: "power2.out" }, allow);
    tl.fromTo(["#s8-g1", "#s8-g2"], { scaleX: 1 }, { scaleX: 0, duration: 0.35, ease: "power2.inOut" }, allow + 0.12);
    wipe("#s8-mcp", allow + 0.2, 0.45);
    const ask = W("a08", "agent") - 0.35;
    const caret2 = typed("#s8-l1", "> Where is the offsite?", ask, 0.035, ask - 0.4);
    gsap.set("#s8-l2", { clipPath: "inset(0% 100% 0% 0%)" });
    tl.to("#s8-l2", { clipPath: "inset(0% 0% 0% 0%)", duration: 0.3, ease: "power3.out" }, W("a08", "ask"));
    tl.set(caret2, { opacity: 0 }, W("a08", "ask"));
    const through = W("a08", "ask") + 0.22;
    go("#dot3", through, { y: 2610 }, 0.3, "power2.in");
    trace(through, 12000, 0.35, "power2.in");
    const answer = W("a08", "too");
    go("#dot3", answer - 0.05, { scale: 0 }, 0.12, "power3.in");
    tl.fromTo("#s8-ans", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "power3.out" }, answer);

    // ---- The pull-back: the whole route, inside one Mac ----
    gsap.set("#w-top", { opacity: 0 });
    tl.to("#w-top", { opacity: 1, duration: 0.5, ease: "power2.inOut" }, T.pull + 0.55);
    tl.to("#w-world .plate", { opacity: 0, duration: 0.3, ease: "power2.in" }, T.pull + 0.25);
    const five = W("a09", "five");
    $$(".mplate").forEach((plate, i) => wipe(plate, five + i * 0.12, 0.4));
    const lw = $$(".lw");
    blurIn(lw[0], Math.max(W("a09", "sentence"), T.pull + 1.2));
    blurIn(lw[1], five);
    blurIn(lw[2], W("a09", "ten"));
    // "One Mac." lands on "running", ahead of its word, so the finished line holds two seconds.
    blurIn(lw[3], W("a09", "running"));
    put("#w-bead", { strokeDashoffset: 230 });
    go("#w-bead", W("a09", "all") - 0.1, { strokeDashoffset: -12010 }, 1.8, "power1.inOut");
    // The route runs back into one dot, which the end card picks up; the Mac leaves downward.
    put("#w-trace-top", { strokeDashoffset: 0 });
    go("#w-trace-top", T.out, { strokeDashoffset: -11990 }, 0.3, "power2.in");
    tl.set("#w-trace", { opacity: 0 }, T.out);
    put("#w-dot", { opacity: 0, x: -248, y: 54.5, scale: 0.4 });
    jump("#w-dot", T.out + 0.26, { opacity: 1 });
    go("#w-dot", T.out + 0.26, { x: 0, y: 0, scale: 1 }, 0.36);
    go("#w-world", T.out + 0.18, { y: 1200 }, 0.45, "power3.in");
    tl.to([".mplate", "#w-line"], { y: 1100, duration: 0.45, ease: "power3.in" }, T.out + 0.18);

    tl.set({}, {}, LEN);
    window.__timelines["world"] = tl;
  </script>
</template>
