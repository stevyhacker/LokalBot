<script>
// ════════════════════════════════════════════════════════════════════════════════════════════════════
// CONCEPT — the desk machine, as a technical overview. One tabletop machine, seen from above; each part of
// LokalBot is a station and every beat is the collision that starts the next:
//   two capture pucks (mic · Core Audio tap) feed the LokalBot robot, whose foot is a recorder → Nemotron splits
//   voices into speaker lanes → Qwen3-ASR prints a timestamped tape → the Qwen3.5 press (built-in llama.cpp)
//   ejects the summary →
//   everything is filed in the SQLite cabinet (FTS5 + Harrier vectors) → the opt-in screen lane reads
//   accessibility text, falls back to Vision OCR, redacts credentials, seals pixels, expires in 14 days →
//   search probes both indexes and opens 00:00:26, which plays → the read-only CLI/MCP port switches on →
//   the camera pulls back over the whole machine on "Your Mac" and the name drops onto the table.
// Facts: README (Privacy, Local AI, For developers & agents) and DEVELOPMENT.md. Data: Scripts/seed_demo_library.py.
// Look: LokalBot's light appearance (DesignTokens.swift, Brand.swift) and its icon; SF type like the app and website.
// ════════════════════════════════════════════════════════════════════════════════════════════════════
const TLd = window.TL, DUR = TLd.dur, FPS = 30, VO = TLd.vo, MEET = TLd.meet;
const {clamp, lerp, sstep, ssstep, seg, spring} = OM, E = Object.assign({}, OM.ease, {cubicIn: u => u * u * u, quadIn: u => u * u});
// Brand.tealFill · Brand.teal (text) · Brand.them · successText · attentionText · recordingText · the icon's mint and slate
const C = LOOK.color, TEAL = C.accent, TEALT = '#075f55', THEM = C.accent2, THEMT = '#4f6f93', SUCCESS = '#176f2c', ATTN = '#984c00',
  RED = '#b60012', MINT = '#6ef2dc', MINT2 = '#23c4ae', INK = C.ink, MUTE = C.mute, LINE = C.line, DEEP = C.deep;
const SYS = '-apple-system, "SF Pro Display", "SF Pro Text", system-ui, sans-serif', MONO = 'ui-monospace, "SF Mono", Menlo, monospace';
const F = (role, px, w) => role === 'mono' ? `${w || 500} ${px}px ${MONO}` : `${w || (role === 'display' ? 700 : 500)} ${px}px ${SYS}`;
const TRACK = px => (-0.02 * px).toFixed(1) + 'px';
const wd = (line, w, n = 0) => { const m = VO[line - 1].words.filter(x => x[0].toLowerCase().replace(/[^a-z0-9]/g, '') === w);
  const x = n < 0 ? m[m.length + n] : m[n]; if (!x) throw new Error(`no "${w}" in VO line ${line}`); return x[1]; };

// ─────────────────────────────── beats (each on the word it lands on) ───────────────────────────────
const T = {
  DROP: [[0.15, 0.45], [0.32, 0.62]],
  REC: wd(1, 'records'), MIC: wd(1, 'microphone'), SYS: wd(1, 'meeting'), NOBOT: wd(1, 'no'),
  SPLIT: wd(2, 'tells'), EIGHT: wd(2, 'apart'),
  PRINT: wd(3, 'transcribes') - 0.3, STAMP: wd(3, 'timestamps'),
  SLAM: wd(4, 'writes'), EJECT: [wd(4, 'decisions') - 0.1, wd(4, 'action') - 0.1, wd(4, 'items') + 0.1, wd(4, 'items') + 0.32],
  LANDS: wd(5, 'lands'), KEYWORD: wd(5, 'keyword'), MEANING: wd(5, 'meaning'), HARRIER: wd(5, 'harrier'),
  OPTIN: wd(6, 'opt'), AX: wd(6, 'accessibility'), OCR: wd(6, 'ocr'),
  REDACT: wd(7, 'redacted') - 0.1, SEAL: wd(7, 'encrypted'), EXPIRE: wd(7, 'fourteen'),
  TYPE: VO[7].t - 0.5, PROBE_K: wd(8, 'search'), PROBE_M: wd(8, 'search') + 0.16, RES: wd(8, 'opens'), OPEN: wd(8, 'exact') - 0.08, MOMENT: wd(8, 'moment'),
  PORT: VO[8].t, CLI: wd(9, 'cli'), MCP: wd(9, 'mcp'), OFF: wd(9, 'off'), ON: wd(9, 'turn'),
  PULL: [VO[9].t - 0.45, VO[9].t + 1.1], ACCOUNT: wd(10, 'no'), TELEMETRY: wd(10, 'telemetry'), REMOTE: wd(10, 'remote'), APPROVAL: wd(10, 'approval'),
  NAME: VO[10].t + 0.1, FREE: wd(11, 'free'),
};

// ─────────────────────────────── the table (world px) ───────────────────────────────
const MIC = [300, 400], SYSP = [300, 740], ROBOT = {x: 650, y: 430, w: 290, h: 290};
const SPL = {x: 1180, y: 400, w: 300, h: 340}, ASR = {x: 1640, y: 390, w: 300, h: 360}, MOUTH = 1940;
const LANE = {you: 520, other: 620};
const PRESS = {x: 4000, y: 360, w: 360, h: 420};
const LIB = {x: 2200, y: 1150, w: 900, h: 560};
const TERM = {x: 1180, y: 1250, w: 800, h: 380}, PORT = [LIB.x - 10, 1440];
const LEVER = [640, 1840], READER = {x: 1020, y: 1880, w: 280, h: 300}, OCRL = {x: 1040, y: 2330, w: 240, h: 150};
const REDACT = {x: 1540, y: 1880, w: 240, h: 300}, LOCK = {x: 2060, y: 2200, w: 420, h: 260};
const SEARCH = {x: 3230, y: 1880, w: 760, h: 96}, TRAY = {x: 3180, y: 2050, w: 1400, h: 300};
const PLAYER = {x: 3280, y: 1790, w: 1200, h: 560, r: 28};
const PLATE = {x: 120, y: 190, w: 5240, h: 2440, r: 80}, NETGATE = [PLATE.x + PLATE.w, 1300], REMOTE = {x: 5620, y: 1180, w: 360, h: 240};
const NAME_AT = [3050, 3080], NAME_PX = 440;

// the transcript tape: Design review turns at their real times, one lane per speaker
const K = 24;                                       // tape px per second of meeting time
const TURNS = [
  {lane: 'you', ts: 0, text: 'I propose Redis for the pub-sub support.'},
  {lane: 'other', ts: 12, text: 'Agreed on Redis. Open question: do we need…'},
  {lane: 'you', ts: 26, text: 'I’ll draft the eviction-policy doc by Thursday.'},
  {lane: 'other', ts: 38, text: 'Please benchmark failover latency…'},
];
const who = l => l === 'you' ? {name: 'You', col: TEAL} : {name: 'Other speaker', col: THEM};
const mmss = s => `00:00:${String(s).padStart(2, '0')}`;
// tape speed profile (px/s), integrated once at 240 Hz
const VKEYS = [[0, 0], [T.PRINT, 0], [T.PRINT + 0.1, 420], [VO[2].end - 0.1, 420], [VO[2].end + 0.4, 220], [T.SLAM - 0.25, 220], [T.SLAM - 0.12, 0], [DUR, 0]];
const vAt = t => { for (let i = 1; i < VKEYS.length; i++) if (t <= VKEYS[i][0]) { const [a, va] = VKEYS[i - 1], [b, vb] = VKEYS[i]; return lerp(va, vb, E.smooth(seg(t, a, b))); } return 0; };
const BELT = (() => { const n = Math.ceil(DUR * 240) + 2, a = new Float64Array(n); let x = 0; for (let i = 1; i < n; i++) { x += vAt((i - 0.5) / 240) / 240; a[i] = x; } return a; })();
const belt = t => { const f = clamp(t, 0, DUR) * 240, i = Math.floor(f), k = f - i; return lerp(BELT[i], BELT[Math.min(i + 1, BELT.length - 1)], k); };
let TW = [];                                        // measured turn widths
const turnX = (i, t) => MOUTH + belt(t) - TURNS[i].ts * K - TW[i] - 24;

// the summary Qwen3.5 writes (seeded Design review), with its citations
const CW = 470, CH = 160;
const CARDS = [
  {kind: 'DECISION', text: 'Adopt Redis for the caching layer', owner: '', ts: '00:00:00', x: 3560, y: 880},
  {kind: 'ACTION', text: 'Draft the eviction-policy document by Thursday', owner: 'You', ts: '00:00:26', x: 4060, y: 880},
  {kind: 'ACTION', text: 'Benchmark failover latency before cluster mode', owner: 'Other speaker', ts: '00:00:38', x: 3560, y: 1070},
  {kind: 'OPEN QUESTION', text: 'Do we need Redis cluster mode at launch?', owner: '', ts: '00:00:12', x: 4060, y: 1070},
];
const DRAWER = {tr: {x: LIB.x + 40, y: LIB.y + 110, w: 400, h: 190}, su: {x: LIB.x + 40, y: LIB.y + 330, w: 400, h: 190}};

// ─────────────────────────────── camera: an operator chasing the cause ───────────────────────────────
const KEYS = [
  {t: 0, x: 540, y: 575, zoom: 1.1},
  {t: T.NOBOT + 0.5, x: 620, y: 590, zoom: 1.06, curve: E.sineInOut},
  {t: VO[1].t + 0.4, x: 1250, y: 570, zoom: 1.06, curve: E.expoInOut},
  {t: T.PRINT + 0.4, x: 1900, y: 570, zoom: 0.98, curve: E.expoInOut},
  {t: VO[2].end + 0.2, x: 2750, y: 580, zoom: 0.86, curve: E.sineInOut},
  {t: T.SLAM - 0.5, x: 3900, y: 640, zoom: 0.9, curve: E.sineInOut},
  {t: VO[3].end, x: 4150, y: 820, zoom: 0.86, curve: E.sineInOut},
  {t: T.LANDS + 0.2, x: 3300, y: 1150, zoom: 0.62, curve: E.expoInOut},
  {t: T.KEYWORD - 0.4, x: 2680, y: 1430, zoom: 0.98, curve: E.sineInOut},
  {t: VO[4].end, x: 2700, y: 1430, zoom: 0.98},
  {t: VO[5].t + 0.5, x: 1100, y: 2020, zoom: 0.9, curve: E.expoInOut},
  {t: T.OCR - 0.2, x: 1250, y: 2080, zoom: 0.9, curve: E.sineInOut},
  {t: T.REDACT, x: 1660, y: 2040, zoom: 1.08, curve: E.expoInOut},
  {t: T.SEAL + 0.2, x: 2150, y: 2200, zoom: 1.0, curve: E.sineInOut},
  {t: T.TYPE - 0.45, x: 2200, y: 2210, zoom: 1.0},
  {t: T.TYPE + 0.15, x: 3700, y: 2080, zoom: 0.9, curve: E.expoInOut},
  {t: T.OPEN + 0.1, x: 3760, y: 2090, zoom: 0.92, curve: E.sineInOut},
  {t: T.MOMENT + 0.5, x: 3880, y: 2070, zoom: 1.06, curve: E.sineInOut},
  {t: MEET.end + 0.15, x: 3880, y: 2070, zoom: 1.06},
  {t: T.PORT + 0.55, x: 1740, y: 1430, zoom: 0.98, curve: E.expoInOut},
  {t: T.PULL[0], x: 1760, y: 1430, zoom: 0.98, curve: E.sineInOut},
  {t: T.PULL[1], x: 3050, y: 1760, zoom: 0.29, curve: E.expoInOut},
];
const HITS = [[T.DROP[0][1], 6, 9], [T.DROP[1][1], 6, 9], [T.SLAM, 9, 8], [T.REDACT + 0.18, 5, 10], [T.SEAL + 0.3, 4, 10]];
const handEnv = t => sstep(0.8, 1.4, t) * (1 - sstep(T.PULL[0] - 0.4, T.PULL[0], t)) * (1 - 0.8 * sstep(MEET.t - 0.5, MEET.t, t) * (1 - sstep(MEET.end, MEET.end + 0.4, t)));
function camAt(t) {
  const c = OM.camera(t, KEYS), e = handEnv(t) * 3.0;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom, y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom, rot = c.rot;
  for (const [th, amp, decay] of HITS) { const s = OM.shake(t, th, {amp, decay, seed: Math.round(th * 100)}); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot * 0.3; }
  return {x, y, zoom: c.zoom, rot};
}

// ─────────────────────────────── canvas helpers ───────────────────────────────
const cv = document.getElementById('c'), g = cv.getContext('2d');
let DPR = 1, CAM, VIEW;
const mat = M => g.setTransform(M[0] * DPR, M[1] * DPR, M[2] * DPR, M[3] * DPR, M[4] * DPR, M[5] * DPR);
const screen = () => g.setTransform(DPR, 0, 0, DPR, 0, 0);
function rr(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function txt(s, x, y, f, col, align = 'left', base = 'alphabetic') { g.font = f; g.fillStyle = col; g.textAlign = align; g.textBaseline = base; g.fillText(s, x, y); }
function lift(h, a = 0.18) { const s = CAM.zoom * DPR; g.shadowColor = `rgba(14,20,28,${a * 0.9})`; g.shadowBlur = Math.min(h * 1.6 * s, 160 * DPR); g.shadowOffsetY = Math.min(h * 0.7 * s, 60 * DPR); g.shadowOffsetX = Math.min(h * 0.25 * s, 20 * DPR); }
const flat = () => { g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetX = 0; g.shadowOffsetY = 0; };
function block(x, y, w, h, r, h3, fill = '#ffffff') { lift(h3); g.fillStyle = fill; rr(x, y, w, h, r); g.fill(); flat(); g.strokeStyle = 'rgba(14,20,28,0.08)'; g.lineWidth = 1.2 / Math.min(1, CAM.zoom); g.stroke(); }
const hexA = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
function mixC(a, b, k) { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], k))).join(',')})`; }
function station(B, title, sub, h3 = 40) { block(B.x, B.y, B.w, B.h, 26, h3); txt(title, B.x + 26, B.y + 58, F('display', 34), INK); sub.split('\n').forEach((s, i) => txt(s, B.x + 26, B.y + 90 + i * 26, F('mono', 19), MUTE)); }
function groove(pts, w, col = DEEP) { g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = col; g.lineWidth = w; g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke(); }
function wrapTxt(s, x, y, maxW, f, col, lh) { g.font = f; let line = '', yy = y; for (const w of s.split(' ')) { const n = line ? line + ' ' + w : w; if (g.measureText(n).width > maxW && line) { txt(line, x, yy, f, col); line = w; yy += lh; } else line = n; } if (line) txt(line, x, yy, f, col); }
function pill(s, x, y, f, bg, fg, e = {op: 1, s: 1}, h = 44) { g.font = f; const w = g.measureText(s).width + h * 0.9; g.save(); g.globalAlpha *= e.op; g.translate(x, y); g.scale(e.s, e.s); lift(8, 0.15); g.fillStyle = bg; rr(-w / 2, -h / 2, w, h, h / 2); g.fill(); flat(); txt(s, 0, h * 0.18, f, fg, 'center'); g.restore(); return w; }
const pop = (t, t0, o = {}) => OM.popIn(t, t0, Object.assign({rise: 0, s0: 0.6, ds: 0.4, zeta: 0.6, omega: 22}, o));

// ─────────────────────────────── 1 · capture ───────────────────────────────
function puck(P, dropT, label, file, api, col, t, cueT) {
  if (t < dropT[0]) return;
  const k = E.expoIn(seg(t, ...dropT)), im = OM.impact(t, dropT[1], {sqx: 0.08, sqy: 0.08}), s = lerp(1.35, 1, k) * (t >= dropT[1] ? im.sx : 1);
  g.save(); g.translate(...P); g.scale(s, s); g.globalAlpha = sstep(dropT[0], dropT[0] + 0.12, t);
  lift(lerp(120, 14, k), 0.2); g.fillStyle = '#ffffff'; g.beginPath(); g.arc(0, 0, 74, 0, 7); g.fill(); flat();
  g.strokeStyle = LINE; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, 56, 0, 7); g.stroke();
  const live = t >= T.REC; g.fillStyle = live ? RED : '#cfd5d5'; g.beginPath(); g.arc(0, 0, 19 * (live ? 1 + 0.07 * Math.sin(t * 17 + P[1]) : 1), 0, 7); g.fill();
  g.restore();
  for (let r = 0; r < 3; r++) { const r0 = T.REC + r * 0.55 + (P === SYSP ? 0.25 : 0); const u = seg(t, r0, r0 + 1.1); if (u > 0 && u < 1 && t < SPLITT()) { g.strokeStyle = hexA(TEAL, 0.4 * (1 - u)); g.lineWidth = 3; g.beginPath(); g.arc(...P, 86 + 200 * E.quadOut(u), 0, 7); g.stroke(); } }
  const hi = sstep(cueT - 0.05, cueT + 0.2, t) * (1 - sstep(cueT + 1.4, cueT + 1.8, t));
  const ly = P === MIC ? P[1] - 170 : P[1] + 136;
  txt(label, P[0], ly, F('display', 30), INK, 'center'); txt(file, P[0], ly + 30, F('mono', 19), hi > 0.3 ? TEALT : MUTE, 'center'); txt(api, P[0], ly + 56, F('mono', 19), hi > 0.3 ? INK : MUTE, 'center');
}
const SPLITT = () => T.SPLIT + 0.4;
function robot(t) {
  const R = ROBOT, ic = document.getElementById('icon'), k = R.w / 1024, live = t >= T.REC && t < T.PRINT + 1.6;
  const e = OM.popIn(t, 0.05, {rise: 0, s0: 0.9, ds: 0.1, zeta: 0.6, omega: 18});
  g.save(); g.translate(R.x + R.w / 2, R.y + R.h / 2); g.scale(e.s, e.s); g.translate(-R.w / 2, -R.h / 2); g.globalAlpha = e.op;
  lift(30, 0.22); g.fillStyle = '#16202c'; rr(64 * k, 64 * k, 896 * k, 896 * k, 204 * k); g.fill(); flat();
  g.drawImage(ic, 0, 0, R.w, R.h);
  if (live) {                                   // the recorder foot's waveform, live
    g.save(); g.scale(k, k);
    const fg = g.createLinearGradient(268, 592, 760, 760); fg.addColorStop(0, MINT); fg.addColorStop(1, MINT2);
    g.fillStyle = fg; g.fillRect(540, 612, 196, 128);
    [556, 602, 648, 694].forEach((x, i) => { const h = 34 + 70 * Math.abs(Math.sin(t * (7 + i * 1.7) + i)); g.fillStyle = '#0e141c'; rr(x, 676 - h / 2, 26, h, 13); g.fill(); });
    g.restore();
  }
  g.restore();
  const hi = sstep(T.REC - 0.1, T.REC + 0.3, t) * (1 - sstep(T.PRINT + 1.2, T.PRINT + 1.6, t));
  if (hi > 0) { g.strokeStyle = hexA(TEAL, 0.55 * hi); g.lineWidth = 4; rr(R.x + 56 * k - 8, R.y + 56 * k - 8, 912 * k + 16, 912 * k + 16, 212 * k + 8); g.stroke(); }
  txt('LokalBot', R.x + R.w / 2, R.y - 22, F('display', 30), INK, 'center');
}
// audio beads flow from both pucks into the splitter; after it, beads take their speaker's colour
function beads(t) {
  if (t < T.REC) return;
  const run = 1 - sstep(T.PRINT + 1.2, T.PRINT + 1.6, t);
  if (run <= 0) return;
  const paths = [[[MIC[0] + 80, MIC[1]], [560, MIC[1]], [ROBOT.x - 8, 530], [ROBOT.x + ROBOT.w + 8, 530], [SPL.x - 10, 530]],
                 [[SYSP[0] + 80, SYSP[1]], [560, SYSP[1]], [ROBOT.x - 8, 610], [ROBOT.x + ROBOT.w + 8, 610], [SPL.x - 10, 610]]];
  paths.forEach((pts, p) => {
    for (let k = 0; k < 9; k++) {
      const u = ((t - T.REC) * 0.55 + k / 9 + p * 0.05) % 1, x = pathAt(pts, u);
      if (x[0] > ROBOT.x - 4 && x[0] < ROBOT.x + ROBOT.w + 4) continue;              // inside the robot
      g.globalAlpha = run * sstep(T.REC, T.REC + 0.4, t) * sstep(0, 0.06, u) * (1 - sstep(0.95, 1, u));
      const bg = g.createLinearGradient(x[0] - 13, x[1] - 13, x[0] + 13, x[1] + 13); bg.addColorStop(0, MINT); bg.addColorStop(1, MINT2);
      g.fillStyle = bg; lift(6, 0.2); g.beginPath(); g.arc(x[0], x[1], 13, 0, 7); g.fill(); flat();
      g.fillStyle = INK; for (let j = -1; j <= 1; j++) g.fillRect(x[0] + j * 5 - 1.2, x[1] - (j ? 4 : 7), 2.4, j ? 8 : 14);
    }
  });
  g.globalAlpha = 1;
  if (t >= T.SPLIT) {                           // speaker lanes out of the splitter into ASR
    for (const [lane, col] of [['you', TEAL], ['other', THEM]]) for (let k = 0; k < 4; k++) {
      const u = ((t - T.SPLIT) * 0.8 + k / 4 + (lane === 'other' ? 0.12 : 0)) % 1, x = lerp(SPL.x + SPL.w + 10, ASR.x - 10, u);
      g.globalAlpha = run * sstep(T.SPLIT, T.SPLIT + 0.3, t) * sstep(0, 0.1, u) * (1 - sstep(0.9, 1, u));
      g.fillStyle = col; lift(6, 0.2); g.beginPath(); g.arc(x, LANE[lane], 13, 0, 7); g.fill(); flat();
    }
    g.globalAlpha = 1;
  }
}
function pathAt(pts, u) { let L = 0; const seg_ = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg_.push(d); L += d; }
  let d = u * L; for (let i = 1; i < pts.length; i++) { if (d <= seg_[i - 1]) { const k = d / seg_[i - 1]; return [lerp(pts[i - 1][0], pts[i][0], k), lerp(pts[i - 1][1], pts[i][1], k)]; } d -= seg_[i - 1]; } return pts[pts.length - 1]; }
function noBot(t) {
  if (t < T.NOBOT - 0.1) return;
  const e = pop(t, T.NOBOT - 0.05), out = 1 - sstep(VO[1].t + 0.2, VO[1].t + 0.6, t); if (out <= 0) return;

    txt('Design review', 50, 80, F('display', 40), INK); txt('Zoom · Transcript · You', 50, 116, F('mono', 20), MUTE); txt('00:00:26', 1150, 80, F('mono', 34), TEAL, 'right');

// ─────────────────────────────── 9 · "Your Mac", the network gate, the name ───────────────────────────────

// ─────────────────────────────── the table + seek ───────────────────────────────

// ─────────────────────────────── contract ───────────────────────────────
window.__meta = {dur: DUR, fps: FPS, w: 1920, h: 1080, inFrame: {press: [T.SLAM - 0.3, T.SLAM + 0.5], cabinet: [T.KEYWORD, VO[4].end], player: [T.MOMENT + 0.6, MEET.end], mark: [T.NAME + 0.8, DUR, 'whole']}};
function boxes(t) {

  o.mic = P({x: MIC[0] - 74, y: MIC[1] - 74, w: 148, h: 148}); o.splitter = P(SPL); o.asr = P(ASR); o.press = P(PRESS);
  o.cabinet = P(LIB); o.reader = P(READER); o.lock = P(LOCK); o.search = P(SEARCH); o.term = P(TERM);
  TURNS.forEach((r, i) => { if (t >= T.PRINT && t < T.LANDS + 0.25) o['turn' + i] = P({x: turnX(i, t), y: LANE[r.lane] - 26, w: pw(i), h: 52}); });

  at(T.OPTIN, 'lever', LEVER[0]); at(T.AX, 'lamp', READER.x); at(T.OCR, 'lamp', OCRL.x, 0.7); at(T.REDACT + 0.18, 'slam', REDACT.x, 0.55); at(T.SEAL + 0.1, 'lever', LOCK.x, 0.8); at(T.EXPIRE, 'tick', LOCK.x);

};
