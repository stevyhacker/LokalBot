<!doctype html>
<!-- The YouTube thumbnail, 1280×720: the brand's lockup, the film's idea in three lines, and the
     real live transcript with the film's highlighter on the decision. Render with:
       npx --yes hyperframes@0.8.150 snapshot thumbnail --at 0 --no-end --describe false \
         --zoom '#thumb' --zoom-scale 2 -o <dir>
     then scale the 2560×1440 frame to 1280×720. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0e151d;
      }
      #thumb {
        position: absolute;
        left: 0;
        top: 0;
        width: 1280px;
        height: 720px;
        background: #0e151d;
        font-family: Inter, sans-serif;
        overflow: hidden;
      }
      /* The lockup: the brand's own icon (Assets/lokalbot-icon.svg) and its name. */
      #thumb-icon {
        position: absolute;
        left: 60px;
        top: 52px;
        width: 124px;
        height: 124px;
      }
      /* A hairline around the icon's dark plate, so it holds its shape on the dark ground. */
      #thumb-ring {
        position: absolute;
        left: 67.75px;
        top: 59.75px;
        width: 108.5px;
        height: 108.5px;
        border-radius: 24.7px;
        box-shadow: 0 0 0 2px rgba(242, 247, 245, 0.22), 0 14px 34px rgba(0, 0, 0, 0.5);
      }
      #thumb-name {
        position: absolute;
        left: 204px;
        top: 66px;
        font-size: 84px;
        font-weight: 900;
        letter-spacing: -0.045em;
        line-height: 1.15;
        color: #f2f7f5;
        white-space: nowrap;
      }
      #thumb-line {
        position: absolute;
        left: 66px;
        top: 248px;
        font-size: 104px;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1.16;
        color: #f2f7f5;
        white-space: nowrap;
      }
      #thumb-line b {
        font-weight: 900;
        color: #0e141c;
        background: #fbbf24;
        border-radius: 12px;
        padding: 0 18px 6px;
        margin-left: -18px;
      }
      /* The app's live transcript, as filmed, with the film's highlighter on the decision. */
      #thumb-card {
        position: absolute;
        left: 742px;
        top: 216px;
        width: 571px;
        height: 568px;
        border-radius: 30px;
        overflow: hidden;
        background: #f5f5f5;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      #thumb-shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 571px;
        height: 568px;
      }
      #thumb-mark {
        position: absolute;
        left: 95px;
        top: 224px;
        width: 427px;
        height: 45px;
        border-radius: 6px;
        background: #fbbf24;
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1" data-width="1280" data-height="720">
      <div id="thumb" class="clip" data-start="0" data-duration="1" data-track-index="0">
        <div id="thumb-card" data-layout-allow-overflow>
          <img id="thumb-shot" src="assets/transcript.png" alt="" />
          <div id="thumb-mark"></div>
        </div>
        <div id="thumb-ring"></div>
        <svg id="thumb-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="thumb-bg" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#222e3d" />
              <stop offset="1" stop-color="#0e141c" />
            </linearGradient>
            <linearGradient id="thumb-body" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#6ef2dc" />
              <stop offset="1" stop-color="#23c4ae" />
            </linearGradient>
          </defs>
          <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#thumb-bg)" />
          <rect x="372" y="206" width="36" height="86" rx="18" fill="#3a7d72" />
          <circle cx="390" cy="186" r="42" fill="#fbbf24" />
          <rect x="268" y="276" width="244" height="484" rx="62" fill="url(#thumb-body)" />
          <rect x="268" y="592" width="492" height="168" rx="62" fill="url(#thumb-body)" />
          <rect x="312" y="326" width="156" height="118" rx="38" fill="#0e141c" />
          <circle cx="390" cy="385" r="34" fill="#6ef2dc" />
          <circle cx="402" cy="373" r="10" fill="#eafffa" />
          <rect x="206" y="430" width="44" height="180" rx="22" fill="#3a7d72" />
          <g fill="#0e141c">
            <rect x="556" y="646" width="26" height="60" rx="13" />
            <rect x="602" y="624" width="26" height="104" rx="13" />
            <rect x="648" y="638" width="26" height="76" rx="13" />
            <rect x="694" y="654" width="26" height="44" rx="13" />
          </g>
        </svg>
        <div id="thumb-name">LokalBot</div>
        <div id="thumb-line">One decision,<br /><b>everywhere</b><br />you need it</div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, 1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
