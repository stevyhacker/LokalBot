<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f7f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1119" media="(prefers-color-scheme: dark)" />
  <link rel="canonical" href="https://www.lokalbot.com/blog" />
  <link rel="alternate" type="application/atom+xml" title="LokalBot Blog" href="https://www.lokalbot.com/blog/feed.xml" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="LokalBot" />
  <meta property="og:url" content="https://www.lokalbot.com/blog" />
  <meta property="og:title" content="{{TITLE}}" />
  <meta property="og:description" content="{{META_DESCRIPTION}}" />
  <meta property="og:image" content="https://www.lokalbot.com/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{TITLE}}" />
  <meta name="twitter:description" content="{{META_DESCRIPTION}}" />
  <meta name="twitter:image" content="https://www.lokalbot.com/assets/og-image.png" />
  <link rel="icon" href="/assets/lokalbot-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/assets/lokalbot-icon-512.png" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/icons.css" />
  <script type="application/ld+json">{{STRUCTURED_DATA}}</script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#blog">Skip to posts</a>
  <div class="bg-field" aria-hidden="true"></div>
  <header class="nav" id="top">
    <a class="brand" href="/" aria-label="LokalBot home"><img class="brand__mark" src="/assets/lokalbot-icon.svg" alt="" width="32" height="32" /><span class="brand__name">LokalBot</span></a>
    <nav class="nav__links" aria-label="Primary"><a href="/#features">Features</a><a href="/guides">Guides</a><a href="/guides#compare">Compare</a><a href="/blog" aria-current="page">Blog</a></nav>
    <div class="nav__actions"><a class="icon-link" href="https://github.com/stevyhacker/lokalbot" aria-label="LokalBot on GitHub" target="_blank" rel="noopener"><i class="ph ph-github-logo" aria-hidden="true"></i></a><a class="btn btn--primary btn--sm" href="https://github.com/stevyhacker/lokalbot/releases" target="_blank" rel="noopener">Download</a></div>
  </header>

  <main class="guide-page" id="blog">
    <header class="guide-hero guide-hero--index">
      <p class="eyebrow">LokalBot</p>
      <h1>{{H1}}</h1>
      <p class="guide-hero__lead">{{LEAD}}</p>
      <p class="guide-byline"><a class="blog-feed-link" href="/blog/feed.xml"><i class="ph ph-rss" aria-hidden="true"></i>Subscribe with the Atom feed</a></p>
    </header>

    <section class="blog-list" aria-label="Posts">
{{POST_CARDS}}
    </section>
  </main>

{{FOOTER}}
</body>
</html>
