[package]
name = "lokalbot-memory-bench"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone: not a member of the LinuxWindows workspace.
[workspace]

[dependencies]
lokalbot-core = { path = "../../../../../LinuxWindows/crates/lokalbot-core" }
lokalbot-ai = { path = "../../../../../LinuxWindows/crates/lokalbot-ai" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
debug = false
