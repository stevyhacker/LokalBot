# XCUITest suite (Scripts/ui-tests.sh) — remote, scheduled, and on-demand.
#
# UI tests drive the app through the Accessibility APIs, which needs the
# runner's controlling process to hold two TCC grants (Automation → Xcode and
# Accessibility — see the header of Scripts/ui-tests.sh). GitHub's hosted
# macOS images pre-authorize XCUITest automation, but that arrangement is
# best-effort and can regress between image releases; a self-hosted Mac whose
# runner agent holds the grants is the reliable home for this job. If a run
# dies with "Timed out while enabling automation mode.", the runner lost the
# TCC grant — that is an infrastructure failure, not a test regression.
#
# Runs on every PR (the `changes` job skips the expensive jobs when no app or
# UI-test path changed, or the PR is a draft, so the aggregate check always
# reports; marking a draft ready for review runs the suite), weekly on master,
# and on dispatch. Releases dispatch it for the exact candidate
# (Scripts/prepare-release.sh); it no longer runs on every master push, which
# re-tested trees their pull requests had already tested and took 16% of macOS
# job time in the week to 2026-10-07. Whether it blocks merging remains a
# branch protection decision; the workflow itself does not mutate repository
# state.
#
# The required gate tests on macos-15, the app's oldest supported macOS. Its
# products are built on macos-26 with Xcode 26.4.1, like the shipped app:
# MLX 0.32.3 and later need Swift 6.3, and the macos-15 image has no Xcode
# newer than 26.3. ui-tests-macos26.yml calls this workflow with
# `runner`/`xcode` to run the same suite on macOS 26 in a separate,
# non-required run, weekly and on demand.

name: UI Tests

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Optional single test, e.g. MainWindowUITests/testSearchFindsTranscriptHitAndDeepLinks"
        required: false
        default: ""
      capture_mode:
        description: "Capture readiness or legacy timer (comparison runs are not release gates)"
        type: choice
        options: [ready, legacy]
        default: ready
      cache_mode:
        description: "Compiler cache: warm reuse, cold empty store, off clean-build fallback"
        type: choice
        options: ["warm", "cold", "off"]
        default: warm
      candidate_sha:
        description: "Exact 40-character commit SHA requested by the dispatching checkout"
        required: true
        type: string
  workflow_call:
    inputs:
      runner:
        type: string
        default: macos-15
      xcode:
        type: string
        default: "26.3"
      build_runner:
        type: string
        default: macos-26
      build_xcode:
        type: string
        default: "26.4.1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, runs against the default branch

concurrency:
  # A called run uses the caller's workflow name, so it never cancels the
  # required macOS 15 run of the same ref.
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # enable -e -o pipefail, including outer evidence/log pipelines

jobs:
  changes:
    name: UI relevance
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the UI suite must run
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
        run: python3 Scripts/ci/ui-relevance.py "$BASE_SHA" "$HEAD_SHA"

  build:
    name: UI build (macOS)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Builds with the release toolchain; the test jobs below run the products
    # on `runner`. Move to a self-hosted Mac (runs-on: [self-hosted, macOS])
    # once one exists — see the TCC note at the top of this file.
    runs-on: ${{ inputs.build_runner || 'macos-26' }}
    # A cold checksum-pinned llama.cpp build currently takes close to an hour
    # on GitHub's hosted Macs. Match the unit-test budget so the UI suite still
    # gets time to execute before the Vendor cache has been populated.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bind manual dispatch to the requested candidate
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::candidate_sha must be a full lowercase commit SHA" >&2
            exit 1
          }
          if [[ "$GITHUB_SHA" != "$REQUESTED_SHA" ]]; then
            echo "::error::Requested $REQUESTED_SHA but workflow_dispatch resolved to $GITHUB_SHA" >&2
            exit 1
          fi
          echo "Testing exact candidate \`$REQUESTED_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: ${{ inputs.build_xcode || '26.4.1' }}

      - name: Install build tools
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          xcodegen --version
          cmake --version

      # project.yml lists Vendor/llama-cpp and Vendor/sherpa-onnx as folder
      # references, and XcodeGen validates those paths exist before it will
      # generate. Empty dirs satisfy generation; the contents arrive via the
      # cache/fetch steps below and the pre-build fetch phases.
      - name: Create vendor dirs for XcodeGen
        run: mkdir -p Vendor/llama-cpp Vendor/sherpa-onnx

      - name: Generate project
        run: xcodegen generate

      - name: Cache native vendors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('Scripts/fetch-llama.sh', 'Scripts/fetch-sherpa.sh') }}

      - name: Fetch llama.cpp vendor
        run: bash Scripts/fetch-llama.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/SourcePackages
          key: packages-${{ runner.os }}-${{ runner.arch }}-xcode${{ inputs.build_xcode || '26.4.1' }}-${{ hashFiles('**/Package.resolved') }}

      # Only the content-addressed compiler store is restored. Build products,
      # build databases and provenance always belong to this workflow attempt.
      - name: Identify compatible compiler cache
        id: compiler-key
        run: python3 Scripts/ci/compiler-cache.py key ui
      - name: Restore compiler cache
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        id: compiler-restore
        if: inputs.cache_mode != 'cold' && inputs.cache_mode != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/compilation-cache
          key: ${{ steps.compiler-key.outputs.key }}
          restore-keys: ${{ steps.compiler-key.outputs.prefix }}

      - name: Build UI test targets
        id: compile
        env:
          COMPILER_CACHE_MODE: ${{ inputs.cache_mode || 'warm' }}
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          mkdir -p .build/ui-results
          xcodebuild -version | tee .build/ui-results/toolchain.txt
          printf '| UI phase | Duration | Result |\n| --- | ---: | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          Scripts/ui-tests.sh --build-only 2>&1 | tee .build/ui-results/build.log

      - name: Bound and seal compiler cache
        id: compiler-seal
        if: steps.compile.outputs.cache_save == 'true' && steps.compiler-restore.outputs.cache-hit != 'true'
        run: python3 Scripts/ci/compiler-cache.py seal
      - name: Save compiler cache
        timeout-minutes: 3
        continue-on-error: true
        if: steps.compiler-seal.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/compilation-cache
          key: ${{ steps.compiler-key.outputs.key }}
      - name: Save compiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true
          name: compiler-${{ github.job }}
          path: .build/ci
          retention-days: 14

      - name: Package UI products
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          python3 Scripts/ci/ui-shards.py plan > .build/ui-results/inventory.json
          python3 Scripts/ci/test-products.py pack ui
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: ui-products
          path: .build/transfer
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: ui-results-build
          path: .build/ui-results
          retention-days: 14

  build-smoke:
    # Preserve this check's name and build dependency for existing branch rules.
    name: UI build and critical tests
    needs: build
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: ${{ inputs.xcode || '26.3' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-products
          path: .build/transfer
      - name: Verify and restore compiled UI tests
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py unpack ui
      - name: Enable standard UI motion
        run: defaults write com.apple.universalaccess reduceMotion -bool false
      - name: Verify critical interactions
        if: github.event_name != 'workflow_dispatch' || inputs.filter == ''
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/ui-shards.py run smoke
      - name: Run requested single test
        if: github.event_name == 'workflow_dispatch' && inputs.filter != ''
        env:
          CODE_SIGNING_ALLOWED: "NO"
          UI_TEST_FILTER: ${{ inputs.filter }}
          CAPTURE_MODE: ${{ inputs.capture_mode || 'ready' }}
        run: python3 Scripts/ci/ui-shards.py run single "$UI_TEST_FILTER"
      - name: Save phase evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true
          name: ui-results-smoke
          path: .build/ui-results
          retention-days: 14

  reduced-motion:
    name: UI reduced-motion
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.filter == ''
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: ${{ inputs.xcode || '26.3' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-products
          path: .build/transfer
      - name: Verify and restore compiled UI tests
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py unpack ui
      # Accessibility preferences belong to this runner only.
      - name: Verify Reduce Motion
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          trap 'defaults write com.apple.universalaccess reduceMotion -bool false; defaults write org.localhost.lokalbot.redesign-ci requiresReducedMotion -bool false' EXIT
          defaults write com.apple.universalaccess reduceMotion -bool true
          defaults write org.localhost.lokalbot.redesign-ci requiresReducedMotion -bool true
          python3 Scripts/ci/ui-shards.py run reduced-motion
      - name: Save phase evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true
          name: ui-results-reduced-motion
          path: .build/ui-results
          retention-days: 14

  shards:
    name: UI ${{ matrix.phase }}
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.filter == ''
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        phase: [functional-1, functional-2, background, visual-1000x700, visual-1180x740, visual-1440x900]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: ${{ inputs.xcode || '26.3' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ui-products
          path: .build/transfer
      - name: Verify and restore compiled UI tests
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py unpack ui
      - name: Enable standard UI motion
        run: defaults write com.apple.universalaccess reduceMotion -bool false
      - name: Fetch pinned Bun for the background shard's model stub
        if: matrix.phase == 'background'
        run: echo "LOKALBOT_TEST_BUN=$(bash Scripts/ci/fetch-bun.sh | tail -1)" >> "$GITHUB_ENV"
      - name: Run shard
        env:
          CODE_SIGNING_ALLOWED: "NO"
          UI_PHASE: ${{ matrix.phase }}
          CAPTURE_MODE: ${{ inputs.capture_mode || 'ready' }}
        run: python3 Scripts/ci/ui-shards.py run "$UI_PHASE"
      - name: Save shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: ui-results-${{ matrix.phase }}
          path: .build/ui-results
          retention-days: 14

  complete:
    name: ${{ (inputs.filter != '' || inputs.capture_mode == 'legacy') && 'UI focused / comparison (macOS)' || 'XCUITest (macOS)' }}
    needs: [changes, build, build-smoke, reduced-motion, shards]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require the relevance decision
        if: needs.changes.result != 'success'
        run: |
          echo "::error::The UI relevance job did not succeed" >&2
          exit 1
      - name: No UI-relevant changes
        if: needs.changes.outputs.relevant != 'true'
        run: echo "No app or UI-test paths changed, or the pull request is a draft; the UI suite is not required yet."
      - name: Require successful selected jobs
        if: needs.changes.outputs.relevant == 'true'
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CRITICAL_RESULT: ${{ needs.build-smoke.result }}
          REDUCED_RESULT: ${{ needs.reduced-motion.result }}
          SHARD_RESULT: ${{ needs.shards.result }}
          FILTER: ${{ inputs.filter || '' }}
          CAPTURE_MODE: ${{ inputs.capture_mode || 'ready' }}
        run: |
          python3 Scripts/ci/ui-shards.py gate "$BUILD_RESULT" "$CRITICAL_RESULT" "$REDUCED_RESULT" "$SHARD_RESULT" "$FILTER"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.changes.outputs.relevant == 'true' && inputs.filter == ''
        with:
          pattern: ui-results-*
          path: .build/evidence
      - name: Verify complete test and capture coverage
        if: needs.changes.outputs.relevant == 'true' && inputs.filter == ''
        run: python3 Scripts/ci/ui-shards.py verify .build/evidence
