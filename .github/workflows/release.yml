# Tag-triggered release pipeline for LokalBot.
#
# Automates the manual flow in RELEASING.md: build an ad-hoc archive with
# Hardened Runtime forced ON (the project.yml default is OFF for fast local
# builds), briefly import Developer ID only to export/sign the finished bytes,
# build the styled DMG, notarize + staple both the app and the DMG, Sparkle-
# sign the DMG, render appcast.xml, and upload DMG + appcast to the GitHub
# Release for the tag. In parallel, linux-windows-release.yml builds the Linux
# and Windows archives; once the macOS release exists, their update feeds are
# signed with the same Sparkle key and attached to it.
#
# Required repo secrets (see RELEASING.md "CI release"):
#   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD  the .p12 passphrase
#   KEYCHAIN_PWD           throwaway password for the temp keychain
#   NOTARY_APPLE_ID        Apple ID used for notarytool
#   NOTARY_APPLE_TEAM_ID   team ID (3N8B4562P4)
#   NOTARY_APPLE_PWD       app-specific password for notarytool
#   SPARKLE_PRIVATE_KEY    base64 Ed25519 private key; written to a temp file
#                          and passed to generate_appcast.py --ed-key-file
#                          (and to LinuxWindows/scripts/release-feeds.sh).
#                          The private key must NEVER be committed to the repo.
#
# Optional:
#   AUR_SSH_PRIVATE_KEY    SSH key of the AUR account that maintains
#                          lokalbot-bin (aur.yml). Without it, or without the
#                          AUR_PUBLISH repository variable set to true, the
#                          AUR package is checked but not pushed.
#   WINGET_TOKEN           classic token (public_repo) of the account whose
#                          microsoft/winget-pkgs fork wingetcreate pushes to
#                          (winget.yml). Without it nothing goes to winget.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare this candidate version on master while validation runs; does not publish"
        required: true
        type: string
  push:
    tags: ["v*"]

# One release build at a time; never cancel a run that may already be
# notarizing or uploading.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the Release and upload DMG + appcast
  actions: read # verify validation provenance and retrieve trusted preparation
  pull-requests: read # find the merged pull request whose UI run covers the candidate

defaults:
  run:
    shell: bash # enable -e -o pipefail, including outer evidence/log pipelines

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/master'
    name: Prepare or publish exact candidate
    runs-on: macos-26
    # A cache miss includes a full llama.cpp source build before archive,
    # export, two notarization submissions, stapling, and publication.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # candidate preflight checks the preceding release tag

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.4.1"

      - name: Validate trusted candidate preparation
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: python3 Scripts/ci/release-candidate.py prepare

      - name: Require all five release gates
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci/release-candidate.py gates

      - name: Restore a trusted prepared app when available
        id: prepared
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci/release-candidate.py restore

      # Fail fast if the tag doesn't match the Info.plist marketing version —
      # Sparkle's enclosure URL embeds the tag, so a mismatch ships a feed
      # pointing at the wrong asset path.
      - name: Verify tag matches CFBundleShortVersionString
        if: github.event_name == 'push'
        run: |
          short_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' LokalBot/Info.plist)
          tag="${GITHUB_REF_NAME#v}"
          if [[ "${tag%%-*}" != "$short_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $short_version. Bump LokalBot/Info.plist first (RELEASING.md step 1)." >&2
            exit 1
          fi

      - name: Verify release metadata and notes
        if: github.event_name == 'push' && !contains(github.ref_name, '-')
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 Scripts/release-preflight.py --version "${version%%-*}"

      - name: Validate release secrets
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.NOTARY_APPLE_TEAM_ID }}
          NOTARY_APPLE_PWD: ${{ secrets.NOTARY_APPLE_PWD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=()
          for name in \
            MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD KEYCHAIN_PWD \
            NOTARY_APPLE_ID NOTARY_APPLE_TEAM_ID NOTARY_APPLE_PWD \
            SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing required release secret: %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Install build tools
        if: steps.prepared.outputs.reused != 'true'
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          xcodegen --version
          cmake --version

      # project.yml lists Vendor/llama-cpp and Vendor/sherpa-onnx as folder
      # references, and XcodeGen validates those paths exist before it will
      # generate. Empty dirs satisfy generation; the contents arrive via the
      # cache/fetch steps below and the pre-build fetch phases.
      - name: Create vendor dirs for XcodeGen
        if: steps.prepared.outputs.reused != 'true'
        run: mkdir -p Vendor/llama-cpp Vendor/sherpa-onnx

      - name: Generate project
        if: steps.prepared.outputs.reused != 'true'
        run: xcodegen generate

      - name: Cache native vendors
        if: steps.prepared.outputs.reused != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('Scripts/fetch-llama.sh', 'Scripts/fetch-sherpa.sh') }}

      - name: Fetch llama.cpp vendor
        if: steps.prepared.outputs.reused != 'true'
        run: bash Scripts/fetch-llama.sh

      - name: Fetch sherpa-onnx vendor
        if: steps.prepared.outputs.reused != 'true'
        run: bash Scripts/fetch-sherpa.sh

      - name: Cache Swift packages
        if: steps.prepared.outputs.reused != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/SourcePackages
          key: packages-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('**/Package.resolved') }}

      - name: Resolve Swift packages before unlocking signing authority
        if: steps.prepared.outputs.reused != 'true'
        run: |
          xcodebuild -resolvePackageDependencies \
            -project LokalBot.xcodeproj \
            -scheme LokalBot \
            -clonedSourcePackagesDirPath .build/SourcePackages

      # Hardened Runtime must be ON for notarization; the project default is
      # OFF (project.yml) so local dev builds stay fast. LokalBot's bundled
      # llama.cpp/sherpa runtimes and speech stack are Apple Silicon only, so
      # keep the archive arm64-only instead of asking SwiftPM to compile an
      # unsupported x86_64 slice. This archive is ad-hoc signed: package
      # compilation, project build phases, and downloaded native validation
      # all finish before the Developer ID certificate is imported.
      - name: Archive release payload without Developer ID authority
        if: steps.prepared.outputs.reused != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.NOTARY_APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project LokalBot.xcodeproj \
            -scheme LokalBot \
            -configuration Release \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -archivePath build/LokalBot.xcarchive \
            ENABLE_HARDENED_RUNTIME=YES \
            ARCHS=arm64 \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-"

      # exportArchive does not compile code or run project build phases. Keep
      # the temporary identity unlocked only while Xcode re-signs the finished
      # archive and codesign seals the already validated vendored Mach-O files.
      - name: Export and seal app with short-lived Developer ID authority
        if: steps.prepared.outputs.reused != 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.NOTARY_APPLE_TEAM_ID }}
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/release-app-signing.keychain-db"
          certificate="$RUNNER_TEMP/release-app-signing.p12"
          cleanup_signing_authority() {
            security lock-keychain "$keychain" >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
            security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
          }
          trap cleanup_signing_authority EXIT
          cleanup_signing_authority
          security create-keychain -p "$KEYCHAIN_PWD" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PWD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity_hash="$(security find-identity -v -p codesigning "$keychain" | \
            awk -v team="($APPLE_TEAM_ID)" '$0 ~ /Developer ID Application/ && index($0, team) {print $2}')"
          if [[ ! "$identity_hash" =~ ^[0-9A-F]{40}$ ]]; then
            echo '::error::The imported .p12 must contain exactly one usable Developer ID Application identity for this team.' >&2
            exit 1
          fi

          cat > build/exportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$identity_hash</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/LokalBot.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/exportOptions.plist

          for root in \
            build/export/LokalBot.app/Contents/Resources/llama-cpp \
            build/export/LokalBot.app/Contents/Resources/sherpa-onnx; do
            [[ -d "$root" ]] || continue
            while IFS= read -r -d '' item; do
              file -b "$item" | grep -q 'Mach-O' || continue
              /usr/bin/codesign --force --sign "$identity_hash" --keychain "$keychain" \
                --timestamp --options runtime "$item"
            done < <(find "$root" -type f \( -perm -111 -o -name '*.dylib' \) -print0)
          done
          /usr/bin/codesign --force --sign "$identity_hash" --keychain "$keychain" \
            --timestamp --options runtime --entitlements LokalBot/LokalBot.entitlements \
            build/export/LokalBot.app
          cleanup_signing_authority
          trap - EXIT

      - name: Verify exported signatures and secure timestamps
        env:
          APPLE_TEAM_ID: ${{ secrets.NOTARY_APPLE_TEAM_ID }}
        run: |
          python3 Scripts/ci/release-candidate.py verify-app
          codesign --display --verbose=2 build/export/LokalBot.app 2>&1 | grep -Fx "TeamIdentifier=$APPLE_TEAM_ID"
          codesign --verify --deep --strict --verbose=2 build/export/LokalBot.app
          missing_timestamp=0
          while IFS= read -r -d '' item; do
            file -b "$item" | grep -q 'Mach-O' || continue
            if ! codesign --display --verbose=2 "$item" 2>&1 | grep -q '^Timestamp='; then
              echo "::error::Missing secure timestamp: $item" >&2
              missing_timestamp=1
            fi
          done < <(find build/export/LokalBot.app -type f \( -perm -111 -o -name '*.dylib' \) -print0)
          if (( missing_timestamp )); then exit 1; fi

      - name: Package signed candidate for later publication
        if: github.event_name == 'workflow_dispatch'
        run: python3 Scripts/ci/release-candidate.py pack
      - name: Save prepared candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: prepared-app-${{ github.sha }}
          path: build/prepared
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Recheck release authorization after archive preparation
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/ci/release-candidate.py gates

      # Staple the app itself (not just the DMG) so first launch succeeds
      # offline after drag-install.
      - name: Notarize + staple the app
        if: github.event_name == 'push'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.NOTARY_APPLE_TEAM_ID }}
          NOTARY_APPLE_PWD: ${{ secrets.NOTARY_APPLE_PWD }}
        run: |
          ditto -c -k --keepParent build/export/LokalBot.app build/LokalBot-app.zip
          xcrun notarytool submit build/LokalBot-app.zip \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_APPLE_TEAM_ID" \
            --password "$NOTARY_APPLE_PWD" \
            --wait
          xcrun stapler staple build/export/LokalBot.app
          xcrun stapler validate build/export/LokalBot.app
          spctl --assess --type execute --verbose=2 build/export/LokalBot.app

      - name: Build styled DMG
        if: github.event_name == 'push'
        run: |
          dmgbuild_venv="$RUNNER_TEMP/dmgbuild-venv"
          python3 -m venv "$dmgbuild_venv"
          "$dmgbuild_venv/bin/python3" -m pip install --quiet 'dmgbuild==1.6.7'
          "$dmgbuild_venv/bin/python3" Scripts/build_release_dmg.py \
            --app build/export/LokalBot.app \
            --output build/LokalBot.dmg

      - name: Sign, notarize + staple the DMG
        if: github.event_name == 'push'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APPLE_TEAM_ID: ${{ secrets.NOTARY_APPLE_TEAM_ID }}
          NOTARY_APPLE_PWD: ${{ secrets.NOTARY_APPLE_PWD }}
          KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          umask 077
          keychain="$RUNNER_TEMP/release-dmg-signing.keychain-db"
          certificate="$RUNNER_TEMP/release-dmg-signing.p12"
          cleanup_signing_authority() {
            security lock-keychain "$keychain" >/dev/null 2>&1 || true
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -f "$certificate"
            security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
          }
          trap cleanup_signing_authority EXIT
          cleanup_signing_authority
          security create-keychain -p "$KEYCHAIN_PWD" "$keychain"
          security set-keychain-settings -lut 300 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate"
          security import "$certificate" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          rm -f "$certificate"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PWD" "$keychain" > /dev/null
          # codesign reaches the private key through the search list, even
          # with --keychain; cleanup restores the login-only list.
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity_hash="$(security find-identity -v -p codesigning "$keychain" | \
            awk -v team="($NOTARY_APPLE_TEAM_ID)" '$0 ~ /Developer ID Application/ && index($0, team) {print $2}')"
          if [[ ! "$identity_hash" =~ ^[0-9A-F]{40}$ ]]; then
            echo '::error::The imported .p12 must contain exactly one usable Developer ID Application identity for this team.' >&2
            exit 1
          fi
          codesign --force --sign "$identity_hash" --keychain "$keychain" \
            --timestamp build/LokalBot.dmg
          cleanup_signing_authority
          trap - EXIT

          codesign --verify --strict --verbose=2 build/LokalBot.dmg
          xcrun notarytool submit build/LokalBot.dmg \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_APPLE_TEAM_ID" \
            --password "$NOTARY_APPLE_PWD" \
            --wait
          xcrun stapler staple build/LokalBot.dmg
          xcrun stapler validate build/LokalBot.dmg
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 build/LokalBot.dmg

      # sign_update ships in Sparkle's release tarball; the SwiftPM checkout
      # used for the app build doesn't expose it on PATH. Same 2.10.0 pin as
      # project.yml so the signing tool matches the framework we embed.
      - name: Fetch Sparkle sign_update
        if: github.event_name == 'push'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/Sparkle.tar.xz" \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo 'c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  '"$RUNNER_TEMP/Sparkle.tar.xz" \
            | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/Sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      # LAST signing step: the Sparkle signature covers the exact stapled DMG
      # bytes, so nothing may touch the DMG after this. The private key exists
      # only as a temp file for the duration of this step.
      - name: Sparkle-sign + generate appcast
        if: github.event_name == 'push'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/sparkle-ed25519.key"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          # The DMG is published as LokalBot-<version>-macos-arm64.dmg, like
          # the Linux and Windows files; the Publish step uploads it under
          # this name.
          dmg_name="LokalBot-${GITHUB_REF_NAME#v}-macos-arm64.dmg"
          echo "DMG_NAME=$dmg_name" >> "$GITHUB_ENV"
          # --release-tag: the DMG uploads to THIS tag's release, so the
          # enclosure URL must embed it verbatim. Deriving it from the app's
          # version would drop a pre-release suffix (v1.0.0-beta → v1.0.0)
          # and point the feed at a release that doesn't exist.
          python3 Scripts/generate_appcast.py \
            --archive build/LokalBot.dmg \
            --archive-filename "$dmg_name" \
            --app build/export/LokalBot.app \
            --repo "$GITHUB_REPOSITORY" \
            --release-tag "$GITHUB_REF_NAME" \
            --output build/appcast.xml \
            --sign-update-tool "$RUNNER_TEMP/sparkle/bin/sign_update" \
            --ed-key-file "$key_file"
          rm -f "$key_file"

      # Upload the DMG, its checksum and the appcast: the Sparkle feed resolves via
      # releases/latest/download/appcast.xml, so the appcast must live on the
      # Release next to the DMG it signs. Hyphenated tags (v1.0.0-beta) become
      # pre-releases and never become "latest" (RELEASING.md step 7).
      # Prefer Scripts/release-notes/<tag>.md as the Release body when present.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 Scripts/ci/release-candidate.py gates
          prerelease_flag=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          notes_file="Scripts/release-notes/${GITHUB_REF_NAME}.md"
          notes_flag=(--generate-notes)
          if [[ -f "$notes_file" ]]; then
            notes_flag=(--notes-file "$notes_file")
          fi
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "LokalBot ${GITHUB_REF_NAME#v}" \
              "${notes_flag[@]}" \
              $prerelease_flag
          elif [[ -f "$notes_file" ]]; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$notes_file"
          fi
          # A copy under the published name keeps the signed bytes untouched.
          cp build/LokalBot.dmg "build/$DMG_NAME"
          (cd build && shasum -a 256 -b "$DMG_NAME" > "$DMG_NAME.sha256")
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "build/$DMG_NAME" "build/$DMG_NAME.sha256" build/appcast.xml

      - name: Delete temp keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release-app-signing.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/release-dmg-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/release-app-signing.p12" "$RUNNER_TEMP/release-dmg-signing.p12"
          security list-keychains -d user -s login.keychain-db

  # The Linux and Windows archives build while the macOS job runs, from the
  # same tag, without any secret.
  linux-windows:
    name: Linux and Windows archives
    if: github.event_name == 'push'
    uses: ./.github/workflows/linux-windows-release.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read

  # Adds a stable release's .deb and .rpm to the apt and dnf repositories at
  # pkg.lokalbot.com once they are attached (linux-repos.yml, which lists its
  # LINUX_REPO_* secrets and skips without them). GitHub-hosted, like every
  # job that sees a secret.
  linux-repos:
    name: apt and dnf repositories
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: linux-windows-publish
    uses: ./.github/workflows/linux-repos.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      LINUX_REPO_GPG_PRIVATE_KEY: ${{ secrets.LINUX_REPO_GPG_PRIVATE_KEY }}
      LINUX_REPO_R2_ACCOUNT_ID: ${{ secrets.LINUX_REPO_R2_ACCOUNT_ID }}
      LINUX_REPO_R2_ACCESS_KEY_ID: ${{ secrets.LINUX_REPO_R2_ACCESS_KEY_ID }}
      LINUX_REPO_R2_SECRET_ACCESS_KEY: ${{ secrets.LINUX_REPO_R2_SECRET_ACCESS_KEY }}
    permissions:
      contents: read

  # Runs only after the macOS job published the release (so its release gates
  # passed), signs the Linux and Windows update feeds with the Sparkle key the
  # DMG uses, checks them against SUPublicEDKey, and attaches archives and
  # feeds to the same release. Installed copies read
  # releases/latest/download/<platform>.json.
  linux-windows-publish:
    name: Sign and attach Linux and Windows updates
    if: github.event_name == 'push'
    needs: [release, linux-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*-x86_64
          path: LinuxWindows/dist
          merge-multiple: true

      # Built before the key exists, so no build script runs beside it.
      - name: Build the feed tool
        working-directory: LinuxWindows
        run: cargo build --release --locked -p lokalbot-update --no-default-features --bin lokalbot-update-feed

      - name: Sign the update feeds
        working-directory: LinuxWindows
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          umask 077
          key_file="$RUNNER_TEMP/sparkle-ed25519.key"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key_file"
          expected=$(/usr/bin/python3 -c 'import plistlib,sys; print(plistlib.load(open(sys.argv[1], "rb"))["SUPublicEDKey"])' ../LokalBot/Info.plist)
          FEED_TOOL=target/release/lokalbot-update-feed \
            scripts/release-feeds.sh dist "$GITHUB_REF_NAME" "$key_file" "$expected"

      - name: Attach to the release
        working-directory: LinuxWindows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/*.tar.gz dist/*.zip dist/*-setup.exe dist/*.deb dist/*.rpm dist/*.pkg.tar.zst dist/*.sha256 \
            dist/linux-x86_64.json dist/windows-x86_64.json

  # Points the lokalbot-bin AUR package at this release once its Linux archive
  # is attached, checks it in a clean Arch container and pushes it with the
  # AUR_SSH_PRIVATE_KEY secret (skipped without it or the AUR_PUBLISH
  # variable). Pre-releases stay off the
  # AUR. GitHub-hosted, like every job that sees a secret.
  aur:
    name: AUR package
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: linux-windows-publish
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    permissions:
      contents: read

  # Opens the winget-pkgs pull request for this version once the Windows
  # installer is attached, with the WINGET_TOKEN secret (skipped without it).
  # Pre-releases stay off winget. GitHub-hosted, like every job that sees a
  # secret.
  winget:
    name: winget package
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: linux-windows-publish
    uses: ./.github/workflows/winget.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    permissions:
      contents: read

  # Builds this release's upgrade fixture on a clean hosted Mac once the DMG
  # is published and keeps it for 90 days, so the next release adds it with
  # Scripts/upgrade-fixtures/add.sh instead of waiting for a runner
  # (RELEASING.md step 0). Pre-releases are never a changelog base.
  upgrade-fixture:
    name: Upgrade fixture
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    needs: release
    uses: ./.github/workflows/upgrade-fixtures.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: read
