# SwiftLint style gate for LokalBot.
#
# Runs in `--strict` mode: any violation (warning or error) fails the check.
# That makes the ruleset in .swiftlint.yml load-bearing — it is deliberately
# lenient so the current codebase is violation-free, and `--strict` keeps it
# that way rather than letting style warnings quietly accumulate.
#
# Findings go through `--reporter github-actions-logging` so they land as inline
# annotations on the PR diff instead of being buried in the run log.

name: Lint

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

concurrency:
  # Lint checks the generated website, so it runs on website pushes too. Each
  # master commit keeps its own run, so one of those can't cancel the Lint of a
  # release candidate. This job is cheap: it doesn't use a macOS runner.
  group: lint-${{ github.ref == 'refs/heads/master' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint
    # SwiftLint's official Linux image, pinned by digest like the actions here.
    # A one-minute lint no longer waits for, or takes, a scarce macOS runner
    # (about 150 macOS jobs a week), and the version no longer drifts with
    # Homebrew. Update the tag and digest together.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run SwiftLint
        # Strict: any violation fails the check. The ruleset (.swiftlint.yml,
        # auto-discovered at the repo root) is tuned to be clean on this code.
        env:
          IMAGE: ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
        run: |
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" swiftlint version
          docker run --rm -v "$PWD:/work" -w /work "$IMAGE" \
            swiftlint lint --strict --reporter github-actions-logging

  generated-web:
    # Comparison pages, guides, /guides, and sitemap.xml are rendered from
    # Scripts/*_pages.py and Scripts/*.template.html. Fail when someone edits
    # the HTML under web/ directly or forgets to re-render after a data change.
    name: Generated web pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check web/ matches Scripts/render_web.py output
        run: python3 Scripts/render_web.py --check
