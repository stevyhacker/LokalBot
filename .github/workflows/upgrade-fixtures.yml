# Builds upgrade fixtures from real, signed releases on clean hosted Macs.
# Never run locally: it writes the app's real defaults domain and Keychain.
#
# Release (release.yml) calls this for each stable tag once its DMG is
# published, so the next release adds that fixture with
# Scripts/upgrade-fixtures/add.sh instead of waiting for a runner. A dispatch
# without versions rebuilds every committed fixture; a pull request that
# changes the generator rebuilds the newest one.
name: Upgrade fixtures

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated releases; empty rebuilds every committed fixture"
        default: ""
  workflow_call:
    inputs:
      tag:
        description: The release tag, e.g. v0.11.2
        required: true
        type: string
  pull_request:
    paths:
      - "Scripts/upgrade-fixtures/**"
      - ".github/workflows/upgrade-fixtures.yml"

permissions:
  contents: read

jobs:
  plan:
    name: Pick versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Pick versions
        id: plan
        env:
          REQUESTED: ${{ inputs.tag || inputs.versions }}
        # REQUESTED is split on spaces into one argument per version.
        run: python3 Scripts/upgrade-fixtures/settings.py plan "$GITHUB_EVENT_NAME" $REQUESTED >> "$GITHUB_OUTPUT"

  generate:
    name: Fixture ${{ matrix.version }}
    needs: plan
    if: needs.plan.outputs.versions != '[]'
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/upgrade-fixtures/generate.sh "${{ matrix.version }}" ".build/upgrade/${{ matrix.version }}"
      # Old seeds name folders like "1:1-with-maya"; artifacts reject ":" in
      # paths, so the fixture travels as one tarball with its names intact.
      - name: Pack
        run: tar -cf ".build/upgrade/fixture-${{ matrix.version }}.tar" -C ".build/upgrade/${{ matrix.version }}" .
      # Kept until the next release adds it, however far off that is.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade-fixture-${{ matrix.version }}
          path: .build/upgrade/fixture-${{ matrix.version }}.tar
          retention-days: 90
