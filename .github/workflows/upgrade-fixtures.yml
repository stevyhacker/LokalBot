# Builds upgrade fixtures from real, signed releases on clean hosted Macs.
# Never run locally: it writes the app's real defaults domain and Keychain.
name: Upgrade fixtures

on:
  workflow_dispatch:
    inputs:
      versions:
        description: "Space-separated releases"
        default: "0.6.2 0.7.2 0.8.5 0.9.0 0.9.1 0.9.2 0.9.3 0.9.4 0.9.5 0.9.6 0.10.0 0.10.1 0.10.2 0.10.3 0.10.4 0.10.5 0.10.6 0.10.7 0.10.8 0.10.9"
  pull_request:
    paths:
      - "Scripts/upgrade-fixtures/**"
      - ".github/workflows/upgrade-fixtures.yml"

permissions:
  contents: read

jobs:
  generate:
    name: Fixture ${{ matrix.version }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: ["0.6.2", "0.7.2", "0.8.5", "0.9.0", "0.9.1", "0.9.2", "0.9.3", "0.9.4", "0.9.5", "0.9.6", "0.10.0", "0.10.1", "0.10.2", "0.10.3", "0.10.4", "0.10.5", "0.10.6", "0.10.7", "0.10.8", "0.10.9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash Scripts/upgrade-fixtures/generate.sh "${{ matrix.version }}" ".build/upgrade/${{ matrix.version }}"
      # Old seeds name folders like "1:1-with-maya"; artifacts reject ":" in
      # paths, so the fixture travels as one tarball with its names intact.
      - name: Pack
        run: tar -cf ".build/upgrade/fixture-${{ matrix.version }}.tar" -C ".build/upgrade/${{ matrix.version }}" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upgrade-fixture-${{ matrix.version }}
          path: .build/upgrade/fixture-${{ matrix.version }}.tar
          retention-days: 14
