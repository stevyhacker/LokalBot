# PR-time build gate for LokalBot (product name: BotinaV2).
#
# On PRs into master/dev and on pushes to those branches: regenerate the
# XcodeGen project and compile in Debug. Debug type-checks every file (same compile surface as
# Release) but is faster and more deterministic, so it's the right signal for a
# "does it still build" gate.
#
# Signing is disabled (CODE_SIGNING_ALLOWED=NO): hosted runners hold no
# Developer ID certificate, and the project uses Automatic signing, so this
# keeps the gate focused on compile correctness without needing certs.

name: Build

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

# Cancel superseded runs for the same ref so rapid pushes/force-pushes don't
# leave a backlog of stale builds burning runner minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # enable -e -o pipefail, including outer evidence/log pipelines

jobs:
  build:
    name: xcodebuild (macOS)
    runs-on: macos-15
    # A cold checksum-pinned llama.cpp source build can take more than 40
    # minutes on GitHub's macOS runners. Keep enough headroom for that first
    # build to finish and populate the shared Vendor cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pin Xcode explicitly: hosted images drift their default Xcode without
      # notice, which surfaces as false red/green builds. Bump deliberately.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.3"

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      # LokalBot.xcodeproj is gitignored (generated from project.yml), so it
      # must be regenerated before xcodebuild can see it.
      - name: Install build tools
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          xcodegen --version
          cmake --version

      # project.yml lists Vendor/llama-cpp and Vendor/sherpa-onnx as folder
      # references, and XcodeGen validates those paths exist before it will
      # generate. Empty dirs satisfy generation; the contents arrive via the
      # cache/fetch steps below and the pre-build fetch phases.
      - name: Create vendor dirs for XcodeGen
        run: mkdir -p Vendor/llama-cpp Vendor/sherpa-onnx

      - name: Generate project
        run: xcodegen generate

      # The pre-build phase Scripts/fetch-llama.sh builds checksum-pinned
      # llama.cpp source for the app's deployment target into Vendor/. GGUF
      # models are user-selected downloads, not bundled in CI artifacts.
      - name: Cache native vendors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('Scripts/fetch-llama.sh', 'Scripts/fetch-sherpa.sh') }}

      # Idempotent: a no-op on a cache hit, the real download on a miss. Running
      # it explicitly (rather than only via the xcodebuild pre-build phase) lets
      # the cache populate and surfaces download failures as their own step.
      - name: Fetch llama.cpp vendor
        run: bash Scripts/fetch-llama.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/SourcePackages
          key: packages-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('**/Package.resolved') }}

      # Compile the app and its tests: app-only builds miss test compiler errors.
      - name: Build app and unit-test targets
        run: |
          xcodebuild \
            -project LokalBot.xcodeproj \
            -scheme LokalBot \
            -configuration Debug \
            -derivedDataPath .build/dd \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:LokalBotTests \
            build-for-testing

      - name: Package unit-test products
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py pack unit

      - name: Upload unit-test products
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: unit-products
          path: .build/transfer
          retention-days: 2
          compression-level: 0
          if-no-files-found: error

  tests:
    name: xcodebuild test (macOS)
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.3"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: unit-products
          path: .build/transfer
      - name: Verify and restore compiled tests
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py unpack unit
      - name: Run unit tests without rebuilding
        run: |
          runs=(.build/dd/Build/Products/*.xctestrun)
          test "${#runs[@]}" -eq 1
          xcodebuild test-without-building -xctestrun "${runs[0]}" \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -only-testing:LokalBotTests -resultBundlePath .build/unit.xcresult
      - name: Save unit results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: unit-results
          path: .build/unit.xcresult
          retention-days: 14
