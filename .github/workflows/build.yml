# PR-time build gate for LokalBot (product name: BotinaV2).
#
# On PRs into master/dev and on pushes to those branches: regenerate the
# XcodeGen project and compile in Debug. Debug type-checks every file (same compile surface as
# Release) but is faster and more deterministic, so it's the right signal for a
# "does it still build" gate.
#
# Signing is disabled (CODE_SIGNING_ALLOWED=NO): hosted runners hold no
# Developer ID certificate, and the project uses Automatic signing, so this
# keeps the gate focused on compile correctness without needing certs.

name: Build

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact 40-character commit SHA requested by the dispatching checkout"
        required: true
        type: string
      cache_mode:
        description: "Compiler cache: warm reuse, cold empty store, off clean-build fallback"
        type: choice
        options: ["warm", "cold", "off"]
        default: warm
  workflow_call:
    inputs:
      cache_mode:
        type: string
        default: warm
      # The nightly workflow needs only the compiled products; it skips the
      # per-PR unit and workday jobs so their failures cannot hide its own.
      products_only:
        type: boolean
        default: false
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]

# Cancel superseded runs for the same ref so rapid pushes/force-pushes don't
# leave a backlog of stale builds burning runner minutes.
concurrency:
  # A called build runs under the caller's workflow name; never cancel the
  # regular Build of the same ref.
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash # enable -e -o pipefail, including outer evidence/log pipelines

jobs:
  changes:
    # Pull requests that change only docs, the website, assets, video or
    # distribution notes skip the macOS jobs below (24 of 103 pull requests in
    # the week to 2026-10-07). Their required checks report as skipped, which
    # GitHub treats as passing. Everything else, and every non-PR event, builds.
    name: Build relevance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.decide.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Decide whether the build must run
        id: decide
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 Scripts/ci/build-relevance.py "$BASE_SHA" "$HEAD_SHA"

  build:
    name: xcodebuild (macOS)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-26
    # A cold checksum-pinned llama.cpp source build can take more than 40
    # minutes on GitHub's macOS runners. Keep enough headroom for that first
    # build to finish and populate the shared Vendor cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bind manual dispatch to the requested candidate
        # In a called workflow github.event_name/github.workflow are the
        # caller's; the exact-SHA binding keeps applying to Build dispatches.
        if: github.event_name == 'workflow_dispatch' && github.workflow == 'Build'
        env:
          REQUESTED_SHA: ${{ inputs.candidate_sha }}
        run: |
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$REQUESTED_SHA"

      # Pin Xcode explicitly: hosted images drift their default Xcode without
      # notice, which surfaces as false red/green builds. Bump deliberately.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.4.1"

      - name: Toolchain info
        run: |
          xcodebuild -version
          swift --version

      # LokalBot.xcodeproj is gitignored (generated from project.yml), so it
      # must be regenerated before xcodebuild can see it.
      - name: Install build tools
        run: |
          if ! command -v xcodegen >/dev/null; then
            brew install xcodegen
          fi
          if ! command -v cmake >/dev/null; then
            brew install cmake
          fi
          xcodegen --version
          cmake --version

      # project.yml lists Vendor/llama-cpp and Vendor/sherpa-onnx as folder
      # references, and XcodeGen validates those paths exist before it will
      # generate. Empty dirs satisfy generation; the contents arrive via the
      # cache/fetch steps below and the pre-build fetch phases.
      - name: Create vendor dirs for XcodeGen
        run: mkdir -p Vendor/llama-cpp Vendor/sherpa-onnx

      - name: Generate project
        run: xcodegen generate

      # The pre-build phase Scripts/fetch-llama.sh builds checksum-pinned
      # llama.cpp source for the app's deployment target into Vendor/. GGUF
      # models are user-selected downloads, not bundled in CI artifacts.
      - name: Cache native vendors
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('Scripts/fetch-llama.sh', 'Scripts/fetch-sherpa.sh') }}

      # Idempotent: a no-op on a cache hit, the real download on a miss. Running
      # it explicitly (rather than only via the xcodebuild pre-build phase) lets
      # the cache populate and surfaces download failures as their own step.
      - name: Fetch llama.cpp vendor
        run: bash Scripts/fetch-llama.sh

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/SourcePackages
          key: packages-${{ runner.os }}-${{ runner.arch }}-xcode26.4.1-${{ hashFiles('**/Package.resolved') }}

      # Only the content-addressed compiler store is restored. Build products,
      # build databases and provenance always belong to this workflow attempt.
      - name: Identify compatible compiler cache
        id: compiler-key
        run: python3 Scripts/ci/compiler-cache.py key unit
      - name: Restore compiler cache
        timeout-minutes: 3
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2
        id: compiler-restore
        if: inputs.cache_mode != 'cold' && inputs.cache_mode != 'off'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/compilation-cache
          key: ${{ steps.compiler-key.outputs.key }}
          restore-keys: ${{ steps.compiler-key.outputs.prefix }}

      # Compile the app and its tests: app-only builds miss test compiler errors.
      - name: Build app and unit-test targets
        id: compile
        env:
          COMPILER_CACHE_MODE: ${{ inputs.cache_mode || 'warm' }}
        run: |
          python3 Scripts/ci/compiler-cache.py build xcodebuild \
            -project LokalBot.xcodeproj \
            -scheme LokalBot \
            -configuration Debug \
            -derivedDataPath .build/dd \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:LokalBotTests \
            build-for-testing

      - name: Bound and seal compiler cache
        id: compiler-seal
        if: steps.compile.outputs.cache_save == 'true' && steps.compiler-restore.outputs.cache-hit != 'true'
        run: python3 Scripts/ci/compiler-cache.py seal
      # The cache and the evidence live in their own folders, so they upload
      # while the products the test jobs need are packed and handed over.
      - name: Save compiler cache
        background: true
        timeout-minutes: 3
        continue-on-error: true
        if: steps.compiler-seal.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .build/compilation-cache
          key: ${{ steps.compiler-key.outputs.key }}
      - name: Save compiler evidence
        background: true
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true
          name: compiler-${{ github.job }}
          path: .build/ci
          retention-days: 14

      - name: Package unit-test products
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py pack unit

      - name: Upload unit-test products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: unit-products
          path: .build/transfer
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
      - name: Wait for the compiler cache and evidence
        wait-all:

  tests:
    name: xcodebuild test (macOS)
    needs: build
    if: ${{ !inputs.products_only }}
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      workday: ${{ steps.workday.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.4.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unit-products
          path: .build/transfer
      - name: Verify and restore compiled tests
        env:
          CODE_SIGNING_ALLOWED: "NO"
        run: python3 Scripts/ci/test-products.py unpack unit
      - name: Fetch pinned Bun for the model stub
        run: echo "TEST_RUNNER_LOKALBOT_TEST_BUN=$(bash Scripts/ci/fetch-bun.sh | tail -1)" >> "$GITHUB_ENV"
      # The workday and the crash probe run beside the unit tests instead of
      # waiting for another macOS runner. Each keeps its own library, defaults
      # suite, temp folder and stub port. The workday reports through the
      # day-in-the-life job, so its failure does not fail the unit tests.
      - name: Run one synthetic workday through the real pipelines
        id: workday
        background: true
        continue-on-error: true
        timeout-minutes: 15
        run: |
          export LOKALBOT_TEST_BUN="$TEST_RUNNER_LOKALBOT_TEST_BUN"
          export LOKALBOT_APP="$PWD/.build/dd/Build/Products/Debug/LokalBot.app"
          bash Scripts/day-in-the-life.sh 2>&1 | tee .build/day-in-the-life.log
      - name: Verify audio recovery after SIGKILL
        id: audio-recovery
        background: true
        run: bash Scripts/tests/audio-recovery-crash.sh
      - name: Run unit tests without rebuilding
        env:
          TEST_RUNNER_CI: "true"
        run: |
          runs=(.build/dd/Build/Products/*.xctestrun)
          test "${#runs[@]}" -eq 1
          xcodebuild test-without-building -xctestrun "${runs[0]}" \
            -destination 'platform=macOS' -derivedDataPath .build/dd \
            -only-testing:LokalBotTests -resultBundlePath .build/unit.xcresult
      - name: Wait for the workday and the crash probe
        wait: [workday, audio-recovery]
      - name: Save unit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: unit-results
          path: .build/unit.xcresult
          retention-days: 14
      - name: Keep the failed library
        if: ${{ !cancelled() && steps.workday.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          overwrite: true # full reruns replace artifacts from earlier attempts
          name: day-in-the-life
          path: |
            .build/day-in-the-life.log
            /tmp/lokalbot-day.*
          retention-days: 14

  # Keeps the required check name; the workday itself runs in the tests job.
  day-in-the-life:
    name: Day in the life (macOS)
    needs: tests
    if: ${{ !cancelled() && needs.tests.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the workday from the unit-test runner
        env:
          WORKDAY: ${{ needs.tests.outputs.workday }}
        run: |
          [[ "$WORKDAY" == success ]] && exit 0
          echo "::error::Synthetic workday outcome: ${WORKDAY:-did not run}. Its log is in the xcodebuild test (macOS) job; a failed library is in the day-in-the-life artifact." >&2
          exit 1
