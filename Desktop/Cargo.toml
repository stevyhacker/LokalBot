[package]
name = "lokalbot-desktop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
default = ["ui", "audio"]
ui = ["dep:gpui-kit"]
audio = ["dep:cpal"]

[dependencies]
gpui-kit = { version = "=0.7.0", optional = true }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
directories = "6"
fs2 = "0.4"
regex = "1"
sha2 = "0.10"
base64 = "0.22"
aes-gcm = "0.10"
rand = "0.8"
tempfile = "3"
hound = "3.5"
cpal = { version = "0.16", optional = true }
clap = { version = "4", features = ["derive", "env"] }
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust", "windows-native", "apple-native"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[[bin]]
name = "lokalbot-desktop"
path = "src/main.rs"
required-features = ["ui"]

[[bin]]
name = "lokalbot-desktop-cli"
path = "src/bin/cli.rs"

[profile.dev]
debug = 0

[profile.release]
strip = true
