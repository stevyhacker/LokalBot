# cargo-about configuration for LICENSES/rust-crates.md, the license notice
# for every crate compiled into the Linux and Windows app. Regenerate the
# notice with scripts/third-party-licenses.sh after changing Cargo.lock.

# Licenses a dependency may use, in order of preference: where a crate offers
# a choice, the first one listed here is used. Every one of them is compatible
# with distributing LokalBot under GPL-3.0 and AGPL-3.0.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "bzip2-1.0.6",
]
# The release builds. macOS-only crates are left out.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
# LokalBot's own crates.
private = { ignore = true }

# Clarifications. cargo-about reads license text only from files whose names
# it recognizes, so the crates below have their license files named here,
# pinned by SHA-256: a changed file falls back to the standard license text
# and shows up as a difference in the generated notice. Crates that ship no
# license file at all get the standard text, with their authors named.
#
# Microsoft's windows-rs crates name their files license-mit and
# license-apache-2.0.
[windows.clarify]
license = "MIT OR Apache-2.0"
[[windows.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"
