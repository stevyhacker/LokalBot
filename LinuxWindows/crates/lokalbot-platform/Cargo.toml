[package]
name = "lokalbot-platform"
description = "OS integration: activity sampling, global shortcuts, text insertion, tray, notifications."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
lokalbot-i18n.workspace = true
lokalbot-core.workspace = true
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
chrono.workspace = true
url = "2.5"
interprocess = "2.4"
open = "5"
notify-rust = "4"
arboard = "3.7"
unicode-segmentation = "1.13"
# Calendars: private iCal/CalDAV links. calcard parses iCalendar, resolves
# IANA, Windows and Outlook zone names, and iterates RRULEs.
calcard = { version = "=0.3.14", default-features = false }
iana-time-zone = "0.1"
roxmltree = "0.21"
ureq.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
global-hotkey = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["screensaver", "res", "xtest", "xfixes", "shape", "randr"] }
# Same runtime as GPUI's Linux backend (async-io, no tokio).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts", "screenshot"] }
futures-lite = "2"
async-channel = "2"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# Unicode typing on X11 (keysym remapping through XTest).
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }
arboard = { version = "3.7", features = ["wayland-data-control"] }
# Screen context on Wayland: the portal's PNG and a request timeout.
png = "0.18"
async-io = "2"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
# `#[implement]` for UI Automation's event handlers names `windows_core`.
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Variant",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
tempfile.workspace = true
env_logger.workspace = true
