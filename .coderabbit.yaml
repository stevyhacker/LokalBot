# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be brief and concrete. Comment only on lines this pull request adds or changes. Skip style nits that CI linters already enforce."
early_access: false

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  poem: false
  in_progress_fortune: false
  review_status: true
  abort_on_close: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - ".*"
    ignore_title_keywords:
      - "[skip review]"

  finishing_touches:
    unit_tests:
      enabled: false

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: warning

  path_filters:
    - "!**/*.lock"
    - "!**/Package.resolved"
    - "!**/package-lock.json"
    - "!LokalBot.xcodeproj/**"
    - "!LinuxWindows/crates/lokalbot-i18n/src/catalogs.rs"
    - "!LokalBot/Resources/ar.lproj/**"
    - "!LokalBot/Resources/ar-EG.lproj/**"
    - "!LokalBot/Resources/bn.lproj/**"
    - "!LokalBot/Resources/de.lproj/**"
    - "!LokalBot/Resources/es.lproj/**"
    - "!LokalBot/Resources/fr.lproj/**"
    - "!LokalBot/Resources/ha.lproj/**"
    - "!LokalBot/Resources/hi.lproj/**"
    - "!LokalBot/Resources/id.lproj/**"
    - "!LokalBot/Resources/it.lproj/**"
    - "!LokalBot/Resources/ja.lproj/**"
    - "!LokalBot/Resources/ko.lproj/**"
    - "!LokalBot/Resources/mr.lproj/**"
    - "!LokalBot/Resources/pcm.lproj/**"
    - "!LokalBot/Resources/pt.lproj/**"
    - "!LokalBot/Resources/ru.lproj/**"
    - "!LokalBot/Resources/sr-Latn.lproj/**"
    - "!LokalBot/Resources/sw.lproj/**"
    - "!LokalBot/Resources/te.lproj/**"
    - "!LokalBot/Resources/ur.lproj/**"
    - "!LokalBot/Resources/vi.lproj/**"
    - "!LokalBot/Resources/zh-Hans.lproj/**"
    - "!LokalBot/Resources/zh-Hant.lproj/**"
    - "!LokalBotTests/Fixtures/**"
    - "!Benchmarks/**/fixtures/**"
    - "!Website/public/lokalbot-vs-*.html"
    - "!Website/public/blog/**"
    - "!Website/public/sitemap.xml"
    - "!Website/public/assets/circuit-board.svg"
    - "!LICENSES/**"
    - "!Scripts/ci/comment-baseline.json"
    - "!Scripts/ci/ui-durations.json"

  path_instructions:
    - path: "**"
      instructions: |
        Review only the diff of this pull request. Do not report problems in code the pull request does not add or change, and do not leave "outside diff range" comments about pre-existing code, unless a changed line breaks or depends on that code; in that case say which changed line causes it.
        Prefer a few high-confidence findings (correctness, data loss, privacy, security, concurrency, crashes) over many low-confidence ones. Skip formatting and naming nits.
        The repository rules are in AGENTS.md. Code carries no comments: do not suggest adding comments or docstrings, and flag new comments in code (lint and formatter directives, shebangs and license notices are fine). Non-obvious decisions belong in an ADR under Docs/decisions/.
    - path: "LokalBot/**"
      instructions: |
        PRIVACY.md is the data and network contract. Flag changes that send data off the device, weaken capture exclusions or retention, or cross a consent boundary (meeting library, screen memory, remote inference, Agent Mode actions, phone and tablet sharing) without the matching consent check.
    - path: "LinuxWindows/**"
      instructions: |
        Same privacy contract as the Mac app (PRIVACY.md). Watch for platform differences between Windows, X11 and Wayland, and for unsafe FFI or COM memory handling.
    - path: "Companion/**"
      instructions: |
        Check that the phone and tablet apps only receive what the Mac explicitly shares, per Companion/README.md.
    - path: "project.yml"
      instructions: |
        project.yml owns the generated Xcode project. Flag dependency pin changes that the pull request does not explain.
    - path: "Website/public/**"
      instructions: |
        Comparison pages, guides, the blog and the sitemap are generated by Website/generator/render_web.py. Flag hand edits to generated HTML; the change belongs in the generator sources.
    - path: ".github/workflows/**"
      instructions: |
        Flag workflows that run untrusted fork code with secrets or write permissions (pull_request_target, workflow_run), and unpinned third-party actions.

  tools:
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    vale:
      enabled: false
    yamllint:
      enabled: false
    swiftlint:
      enabled: false
    clippy:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
      - "PRIVACY.md"
