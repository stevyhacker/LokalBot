name: LokalBotCompanion
options:
  bundleIdPrefix: me.dotenv.LokalBot
  deploymentTarget:
    iOS: "18.0"
  minimumXcodeGenVersion: "2.40"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

# The kit holds models, design, data and view models; the app target is the
# shell (scenes, screens, pairing, background refresh and the Rust-backed
# store). The sync core is the local package Vendor/lokalbot-sync, which is
# generated: run Scripts/build-sync-xcframework.sh before building.
packages:
  LokalBotCompanionKit:
    path: LokalBotCompanionKit
  LokalBotSync:
    path: ../../Vendor/lokalbot-sync

targets:
  LokalBotCompanion:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: LokalBotCompanionKit
      - package: LokalBotSync
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LokalBot
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: >-
          LokalBot finds your Mac and syncs with it directly over your
          network or Tailscale. Nothing goes through a server.
        NSBonjourServices:
          - _lokalbot._tcp
        NSCameraUsageDescription: >-
          LokalBot uses the camera to scan the pairing code your Mac shows.
          Nothing is recorded or saved.
        NSFaceIDUsageDescription: >-
          LokalBot can ask for Face ID before showing your meetings and
          actions, if you turn on App Lock.
        BGTaskSchedulerPermittedIdentifiers:
          - me.dotenv.LokalBot.companion.refresh
        UIBackgroundModes:
          - fetch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.dotenv.LokalBot.companion
        PRODUCT_NAME: LokalBot
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: 3N8B4562P4
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        # The sync core's simulator slice is arm64 only (Apple silicon).
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  LokalBotCompanion:
    build:
      targets:
        LokalBotCompanion: all
    run:
      config: Debug
    archive:
      config: Release
